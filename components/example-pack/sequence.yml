# sequence.yml — the choreography for this pack (AGENT.md §12).
#
# Named from icons.yml (`sequence: sequence.yml`). The viewer plays it; the
# pack loader only reads it. All times are SECONDS. The sequence never owns
# spin: each icon's own controller keeps assigning rotation every frame, so
# there is no rotation channel here — only the entrance (fade / scale / rise on
# the 3D icon and the 2D copy over the canvas) and, once a step's `on:` uses
# `advance`, a multi-step FLOW: tap, the icon flies into a slot, the next one
# enters behind it.
#
# Comments are the point of YAML here: when a timing changes in review, say
# why next to the number.

version: 1

# --- named easing curves ---------------------------------------------------------
# Named for what they DO, so "the whole entrance feels abrupt" is a one-line
# change here rather than a hunt through the tracks below. Any Anime.js easing
# name works (outCubic, inOutQuart, …), or cubic-bezier(a, b, c, d).
ease:
  swell:   &ease-swell   outCubic     # things that grow into place
  resolve: &ease-resolve outQuart     # things that sharpen into place
  leave:   &ease-leave   inQuad       # things that get out of the way

# --- capabilities this sequence needs ---------------------------------------------
# The icon fade needs either a setFade(v) on the icon object or standard
# materials the viewer can fade for you (all three example icons have the
# latter). If neither is available the fade channel is dropped, everything else
# plays, and the console says so once — per icon.
requires:
  icon.fade:
    degrade: scale-only

# --- resume: opt-in, per pack -------------------------------------------------------
# Absent (or `minutes: 0`) means NOTHING is stored in the visitor's browser.
# With it, the current step and the collected slots are written to localStorage
# on every state change, and read back on load if the last change was inside
# the window. Editing this file invalidates a saved state rather than stranding
# someone on a step that no longer exists.
resume:
  minutes: 30
  id: example-pack        # optional; defaults to the pack's name

# --- pointer: how big a grab zone each icon gets -----------------------------------
# A press is HIT-TESTED against the icons actually on screen — the big one and
# every icon already sitting in a ring — and only the nearest hit is dragged.
# `padding` widens each icon's grab zone by this fraction of its projected
# radius, so a small collected object is still catchable with a thumb. A press
# that hits nothing rotates nothing.
hit:
  padding: 0.25            # default 0.25

# --- rest: what happens when a dragged icon is let go --------------------------------
# The RUNTIME owns this, not the pack: `twist` below has no controller at all
# and still comes back. A step may override the whole block.
rest:
  spring: true             # default true; false leaves the icon where it was left
  dur: 0.8                 # seconds — how LONG the return takes
  # …and how it FEELS on the way. Three ways to write it, softest first:
  #   outBack(0.25)         the default: a settle, barely past centre
  #   outBack(0.9)          a clear nudge past centre
  #   outBack               Anime.js's bare 1.70158 — deliberately springy
  #   spring(60, 14)        a real spring: peaks at 1.00, no visible bounce
  #   spring(100, 10)       peaks at 1.16
  #   spring(200, 8)        peaks at 1.40 — the loosest thing here
  # Stiffness raises the overshoot, damping kills it. `dur` still owns timing:
  # a spring is used as the CURVE, not as its own clock.
  ease: outBack(0.25)

# --- what this sequence is allowed to touch ------------------------------------
# Every name used in a track must be declared here. `top`/`left` are viewport
# fractions for the element's CENTER (like the component `framing`), `size` is
# the font size as a fraction of the viewport's shorter side (so a line that
# fits a landscape desktop still fits a portrait phone).
stage:
  hud:
    # Three rings, collected left to right. Each ring is separately addressable
    # as `slot1`, `slot2`, `slot3` — the element's name plus a 1-based index.
    slot: { type: slots, count: 3, top: 0.14, size: 0.075, gap: 0.40, color: "#e9e3f4", dim: "#e9e3f433" }
  icon:
    ref: current                     # a flow always drives the icon itself
    # How an icon is posed when a step it appears in BEGINS. Per-step `start:`
    # overrides this.
    #   reset     (default) back to the authored rest pose, every time
    #   continue  leave it wherever it was
    # This is not cosmetic. An icon's controller accumulates yaw for the life of
    # the pack AND assigns rotation every frame, so with `continue` an icon shown
    # a second time — a restart, or a flow that reuses an icon — snaps back on
    # its first frame to whatever it had spun to. With `reset` an icon sits at
    # effectively zero one frame after a restart — one frame of its own spin —
    # while `continue` can bring it back most of a turn away.
    start: reset
  overlay:
    line1: { type: text, top: 0.72, size: 0.05, weight: 700, tracking: 0.10 }
    line2: { type: text, top: 0.79, size: 0.05, weight: 700, tracking: 0.10 }
    # TWO MODELS, one flag, because the element is declared ONCE here while its
    # animation lives in the shared entrance below:
    #   persist: true   arrives once and is then skipped in every later step —
    #                   never hidden, never re-animated, never moves.
    #   persist: false  its tracks play in EVERY step, so it can leave on tap
    #                   and come back with the next one. That is this sequence.
    cta:   { type: button, top: 0.905, size: 0.055, text: "→", color: "#9cc3ff", persist: false }

# --- state at frame 0 ----------------------------------------------------------
# Not animation. Slots start empty here; `slot: { filled: 1 }` (a count) or
# `slot: { filled: [twist] }` (icon names) would start the flow part-way in.
# initial:
#   slot: { filled: 0 }

steps:

  # ---- step 1 --------------------------------------------------------------------
  # A flow step names the icon it shows: the sequence drives the viewer, not the
  # other way round. The entrance is anchored so every step reuses the exact
  # same choreography — the choreography is the step; the icon and copy are the
  # variables.
  - id: one
    icon: twist
    copy:
      line1: "FIRST LINE OF COPY"
      line2: "SECOND LINE OF COPY"

    timeline: &entrance

      # ICON ENTRANCE — one gesture, two channels. They share a `timing:` so
      # nobody can retune the fade and desync it from the scale by accident.
      - id: icon-entrance
        target: icon
        at: 0.2
        timing: { dur: 0.7, ease: *ease-swell }
        channels:
          fade:  [0, 1]
          scale: [0.52, 1]

      # COPY — two identical gestures down a list, staggered. Written as ONE
      # track because "identical but staggered" is a fact about the design.
      # blur + wipe is the current GUESS at the reveal mechanism; see the
      # `wipe` channel notes in AGENT.md §12.
      - id: copy-resolve
        target: [line1, line2]
        at: 0.4
        stagger: 0.55
        timing: { dur: 1.0, ease: *ease-resolve }
        channels:
          blur: [12, 0]          # px
          wipe: [0, 1]           # left-to-right reveal
          fade: [0, 1]

      # A named time (= when copy-resolve ends, 2.0 s) so the call-to-action is
      # described relative to the copy instead of as a bare number. QUOTE the
      # expression that uses it: `at:` takes a number OR a "label ± seconds"
      # string, and YAML coerces bare scalars — a label called `on`, `no` or
      # `yes` would arrive as a boolean and fail to parse.
      - label: copy-settled

      # CALL TO ACTION — fades and rises with a glow, 0.8 s after the copy
      # settles. Retiming the copy carries it along. The element
      # is `persist: false`, so this track plays in EVERY step: the button
      # leaves in `exit:` on the tap and arrives again right here.
      - id: cta-in
        target: cta
        at: "copy-settled + 0.8"   # quoted: a label expression is a STRING
        timing: { dur: 0.2, ease: *ease-swell }
        channels:
          fade:  [0, 1]
          rise:  [14, 0]         # px, starts below its rest position
          bloom: [0, 1]          # 0–1 intent; the viewer maps it to a glow

    # `exit:` is what plays when this step is LEFT. Its `to:` track is the
    # general "send the 3D icon to a 2D element" primitive: a straight line to
    # the element's centre with a simultaneous shrink to `fit` of its inner
    # diameter. `land.mode: object` keeps the real 3D object in the ring —
    # frozen, because the sequence takes it out of the update path first — and
    # `after: glyph` swaps it for the flat mark a beat later, so an author gets
    # the 3D motion without paying for a permanently live shader.
    exit:
      # The call-to-action leaves the instant it is tapped, faster than the
      # copy, so the tap reads as "taken". It returns in the next step's
      # entrance, on the same track that first brought it in.
      - &cta-out
        id: cta-out
        target: cta
        at: 0
        timing: { dur: 0.18, ease: *ease-leave }
        channels:
          fade:  [1, 0]
          bloom: [1, 0]
      - &copy-out
        id: copy-out
        target: [line1, line2]
        at: 0
        timing: { dur: 0.28, ease: *ease-leave }
        channels:
          fade: [1, 0]
          blur: [0, 10]
      - id: collect
        target: icon
        to: slot1
        at: 0.1
        timing: { dur: 0.6, ease: *ease-swell }
        land:
          mode:  object          # object | glyph
          face:  front           # stop rotating, rest facing front
          fit:   0.68            # fraction of the ring's inner diameter
          after: glyph           # …then become the flat mark
          delay: 0.40            # …this long after touchdown
          fade:  0.12            # …cross-faded over this long (default 0.12)

    on:
      cta.tap: { do: advance }   # verbs: advance, restart, replay, nothing
    end: hold

  # ---- step 2 --------------------------------------------------------------------
  # `overlap` is the one number to retune in review: how many seconds THIS
  # step's entrance starts BEFORE the previous step's exit ends. 0 is strictly
  # sequential; 0.35 has the new icon already swelling in as the old one lands.
  - id: two
    icon: gem
    overlap: 0.30
    copy:
      line1: "A SECOND ICON"
      line2: "THE SAME CHOREOGRAPHY"
    timeline: *entrance
    exit:
      - *cta-out
      - *copy-out
      - id: collect
        target: icon
        to: slot2
        at: 0.1
        timing: { dur: 0.6, ease: *ease-swell }
        land:
          mode: object           # no `after:` — the real object stays in the ring
          face: front
          fit:  0.68
    on:
      cta.tap: { do: advance }
    end: hold

  # ---- step 3 --------------------------------------------------------------------
  - id: three
    icon: prism
    overlap: 0.30
    copy:
      line1: "A THIRD ICON"
      line2: "THE LAST ONE TO COLLECT"
    timeline: *entrance
    exit:
      - *cta-out
      - *copy-out
      - id: collect
        target: icon
        to: slot3
        at: 0.1
        timing: { dur: 0.6, ease: *ease-swell }
        land:
          mode: glyph            # the flat mark appears and the object is released
          fit:  0.68
    on:
      cta.tap: { do: advance }
    end: hold

  # ---- the end state ---------------------------------------------------------------
  # A flow step with no `icon:` is a state, not an icon: nothing is on the
  # canvas and there is no copy. With `persist: false` the call-to-action left
  # with the last tap, so it eases back in here on the same gesture it uses
  # everywhere else — which also covers a RESUME straight into this state.
  - id: done
    timeline:
      - id: cta-in
        target: cta
        at: 0.25
        timing: { dur: 0.2, ease: *ease-swell }
        channels:
          fade:  [0, 1]
          rise:  [14, 0]
          bloom: [0, 1]
    on:
      cta.tap: { do: restart }   # empties the rings instantly and replays step 1
    end: hold
