# icons.yml — the pack manifest. Comments are welcome; this is YAML.
# Each name under `icons:` is a folder under icons/ with a src/index.js that
# has the standard exports (createIconObject, loadIconGeometry, ...).
#
# Order matters once the pack has a multi-step sequence flow: put the icon the
# FIRST step shows first, so the viewer loads exactly the icon the flow starts
# on and nothing has to be swapped at load.
icons:
  - twist
  - gem
  - prism

# Optional pack-wide backdrop: an image path inside the pack, or a CSS colour
# such as "#05061a". Keep images web-sized (~2732 px tall, JPEG q≈80).
background: backgrounds/dusk.jpg

# Optional per-icon overrides, same value rules; anything unlisted falls back
# to `background`.
# backgrounds:
#   gem: "#05061a"

# Optional 2D marks, one per icon, for a sequence to drop into a slot when that
# icon is collected (AGENT.md §12). Paths are relative to component.js, like
# every other asset. Leave the key out — as this pack does — and the viewer
# DERIVES each mark instead, by rendering the icon once, offscreen, at preload.
# glyphs:
#   twist: glyphs/twist.png

# Optional entrance choreography (AGENT.md §12). Leave the key out and the
# pack behaves exactly as it always has.
sequence: sequence.yml

# The LOADING CURTAIN — the opaque layer that is up before the first paint and
# comes down the moment step 1 can draw, backdrop and all (AGENT.md §7).
#
# Three knobs for how it LOOKS:
#   ground     a CSS colour for the layer itself
#   image      an image inside the pack, centred (optional)
#   animation  pulse (default) | none
# There is no spinner and no percentage: the curtain reports a COUNT of the
# resources it is waiting for ("Loading 3 of 6 — …"), because that is a number
# the viewer actually has. Bytes-remaining is not.
#
# …and two for how PATIENT it is, in seconds:
#   slowAfter  say so, and name what it is waiting on          (default 15)
#   failAfter  give up on that resource, name it, offer Retry  (default 45)
# Every network read in the load path is on these. Nothing used to be, which is
# how a link that accepted a connection and then never answered could leave this
# curtain up for ever with nothing on it at all.
#
# A pack that declares nothing still gets a deliberate-looking default.
loading:
  ground: "#0b0d16"        # near-black, a shade off this pack's dusk backdrop
  animation: pulse
  # What a visitor reads while the pack loads. Plain language: the viewer's
  # default is "Loading…" and resource names stay in ?dev= and the failure
  # state, where they are actually actionable.
  message: "Loading…"
  slowAfter: 15            # the viewer's own defaults, written out
  failAfter: 45
