<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GLB Turntable Viewer (three.js)</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 120%, #1c1c22 0%, #101014 55%, #08080a 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #cfd6ea;
  }
  /* --- the stage -------------------------------------------------------------
     Everything the app COMPOSES lives in here: the backdrop, the canvas, the
     overlay and the curtain. It fills the window normally; ?dev=mobile gives it
     a fixed phone-sized box, letterboxed on the body's own ground, so a
     portrait layout and a rotation lock can be reviewed on a desktop.
     Nothing downstream measures the WINDOW — every consumer reads the `stage`
     accessor in the module below — so the emulator and a real device drive one
     code path instead of two that can drift apart.
     `--vmin` is the overlay's type unit. It is 1vmin here (identical to the
     literal vmin the sequence runtime used to write), and the emulator
     overrides it with the emulated stage's own px value. That is the whole
     reason a phone layout can be judged in a desktop window. */
  #stage { position: fixed; inset: 0; overflow: hidden; --vmin: 1vmin; }
  body.devstage #stage {
    inset: auto; top: 50%; left: 50%; transform: translate(-50%, -50%);
    box-shadow: 0 0 0 1px #2a3560, 0 24px 60px #000a;
  }
  /* Backdrop is a 2D layer behind the transparent canvas (never scene geometry),
     so camera moves can't shift it — the same layering a real page uses. */
  #bg { position: absolute; inset: 0; background: center / cover no-repeat; }
  #app { position: absolute; inset: 0; }
  canvas { display: block; }
  /* Foreground overlay: 2D copy and calls-to-action a pack's sequence.yml draws
     ABOVE the canvas (real DOM text — selectable, accessible — never canvas).
     Click-through by default so the icon can still be dragged; only elements a
     sequence binds an action to take pointer events. Emptied on unload. */
  #fg { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #fg .fg-el {
    position: absolute; transform: translate(-50%, -50%);
    /* max-content: an absolutely-positioned box at left:50% would otherwise
       shrink-wrap to the remaining half of the stage and wrap early.
       92% (not 92vw) so an emulated phone stage clamps copy to the STAGE. */
    width: max-content; max-width: 92%;
    text-align: center; white-space: pre-wrap; line-height: 1.15;
    color: #f2f5ff; --glow: #f2f5ff;
    text-shadow: 0 2px 12px #0008;
    will-change: transform, opacity, filter, clip-path;
  }
  #fg .fg-button {
    background: none; border: 0; padding: .1em .4em; font: inherit; color: inherit;
    cursor: default; border-radius: .3em;
  }
  #fg .fg-action { pointer-events: auto; cursor: pointer; }
  #fg .fg-action:hover { text-decoration: underline; text-underline-offset: .15em; }
  /* Slots: a row of rings a sequence collects icons into. Three states —
     pending (dim, empty), next (bright, empty: the ring the current icon will
     land in) and filled (bright, holding that icon's 2D glyph). Every colour
     and size is a custom property the sequence sets from the YAML; the values
     here are only the defaults. */
  #fg .fg-slots { display: flex; gap: .5em; --slot-on: #e9e3f4; --slot-off: #e9e3f444; --slot-ring: .07em; }
  #fg .fg-slot {
    width: 1em; height: 1em; border-radius: 50%; box-sizing: border-box;
    border: var(--slot-ring) solid var(--slot-off); background: transparent;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    /* NO `clip-path` HERE, deliberately, and it is not an oversight — it was
       tried and it MADE A WORSE BUG. `circle(50% at 50% 50%)` resolves to a
       radius of exactly half the border box, which is precisely the ring's
       outer edge, and iOS Safari rasterises that clip a fraction inside the
       stroke at the four diagonals. The result was four black notches at
       45/135/225/315 degrees, eating the ring itself.
       Measured on a real iPhone (iOS 26.6.1), sampling stroke luminance every
       degree at 0.94R, median stroke 236:
         clip-path on,  glyph shown   -> 10 of 360 samples black
         clip-path on,  glyph HIDDEN  ->  8 of 360 black  (so not the glyph)
         clip-path off, glyph shown   ->  0 of 360        CLEAN
       `overflow: hidden` with `border-radius` carries the clipping on its own,
       and the glyph cannot reach the stroke anyway: its captured PNG is
       transparent at the corners and its opaque content stops at .808 of half
       width, well inside the ring. Do not "fix" the rings by adding a clip
       here — that is the bug, not the cure. */
    transition: border-color .25s ease, box-shadow .25s ease;
  }
  #fg .fg-slot.is-next   { border-color: var(--slot-on); box-shadow: 0 0 .5em color-mix(in srgb, var(--slot-on) 55%, transparent); }
  #fg .fg-slot.is-filled { border-color: var(--slot-on); }
  /* 60% is not decorative: the glyph is CAPTURED through the same box (see
     GLYPH_BOX in the sequence host) so the PNG and the live 3D object are the
     same size and the same projection at ring size. Change one, change both.
     The number itself is a geometry constraint — see the ring above. */
  #fg .fg-slot .fg-glyph {
    width: 60%; height: 60%; object-fit: contain; display: block;
    background: transparent;   /* never let a UA paint a matte behind the PNG */
    /* Round the GLYPH's own corners with a mask, not a clip.
       `closest-side` IS LOAD-BEARING. A bare `circle` defaults to
       FARTHEST-CORNER, so a 98% stop lands at 98% of the half-DIAGONAL — past
       every corner of a square box — and the mask silently does nothing.
       Measured on a 48px box: half-side 24, half-diagonal 33.94, so the
       unqualified form masked at 33.26 and clipped no corner at all. With
       `closest-side` the circle is the inscribed one.
       The radius that gives is 50% of the glyph box, which is .30 of the ring
       diameter — far inside the .5 where the stroke lives, and that distance
       is the point. A clip on the RING resolves to exactly the stroke's outer
       edge, which iOS rasterises a hair inside and bites the ring (see above);
       a mask on the GLYPH never comes near it.
       Belt-and-braces only: the box is sized so its corners cannot reach the
       stroke in the first place. */
    -webkit-mask-image: radial-gradient(circle closest-side at 50% 50%, #000 98%, transparent 100%);
            mask-image: radial-gradient(circle closest-side at 50% 50%, #000 98%, transparent 100%);
  }
  /* An author rule beats the UA's [hidden] rule, so say it here too — without
     this an emptied ring shows a broken-image icon instead of nothing. */
  #fg .fg-slot .fg-glyph[hidden] { display: none; }
  /* DEPRECATED: `pips` is the Phase 1 progress row, superseded by `slots`. */
  #fg .fg-pips { display: flex; gap: .9em; }
  #fg .fg-pip {
    width: 1em; height: 1em; border-radius: 50%;
    border: .12em solid #e9e3f4cc; background: transparent; box-sizing: border-box;
  }
  #fg .fg-pip.on { background: #e9e3f4; box-shadow: 0 0 .6em #e9e3f499; }

  /* --- the curtain -----------------------------------------------------------
     ONE opaque layer over the stage, with a REASON and an animation slot. Two
     users today (loading, and the rotation lock's rotate prompt); more can be
     added by giving them a reason rather than a second layer.
     It is in the initial HTML and opaque before the first paint, because a
     curtain added once JS boots only moves the flash earlier — it does not
     remove it. Everything below is a DEFAULT a pack may restyle through
     `loading:` in icons.yml (AGENT.md §7). */
  #curtain {
    position: absolute; inset: 0; z-index: 8;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3vmin;
    background: #08080a;
  }
  /* An author rule, so it beats the UA's [hidden] on a flex element. */
  #curtain[hidden] { display: none !important; }
  /* The quiet default: a soft pulsing disc. Deliberately dumb — no spinner
     library and no fake percentage, because a percentage is a number we cannot
     compute: we know how many resources the first draw needs, not how many
     bytes each one is. A pack's `loading.image` becomes this element's
     background. */
  #curtainMark {
    width: 14vmin; height: 14vmin; max-width: 96px; max-height: 96px;
    border-radius: 50%;
    background: center / contain no-repeat;
    /* Was #cfd6ea26 — 15% alpha, and the pulse floor of .35 opacity took it to
       roughly 5% on a near-black ground, i.e. invisible. */
    box-shadow: inset 0 0 0 .9vmin #cfd6eacc;
    animation: curtain-pulse 1.7s ease-in-out infinite;
  }
  @keyframes curtain-pulse {
    0%, 100% { opacity: .55; transform: scale(.94); }
    50%      { opacity: .95; transform: scale(1); }
  }
  #curtain[data-anim="none"] #curtainMark { animation: none; opacity: .8; }

  /* --- what the curtain SAYS ---------------------------------------------------
     The curtain used to have only a success path, so a slow load and a hung one
     looked identical: dark ground, quiet pulse, for ever. This is the rest of
     it — a progress count while things arrive, a note once a resource is slow,
     and a named failure with a retry when one never arrives at all.
     It lives INSIDE #curtain, so it is readable in bare mode (?ui=0) — which is
     the mode a pack is actually looked at in, on a phone — without the status
     line, which bare mode hides. */
  #curtainSay {
    max-width: min(80vw, 46ch); text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 2.2vmin;
    color: #cfd6ea; font: 500 clamp(12px, 2.1vmin, 15px)/1.45 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  /* pre-line, so a failure's second sentence (what went wrong) sits on its own
     line without any markup in the message itself. */
  #curtainMsg { margin: 0; opacity: .82; overflow-wrap: anywhere; white-space: pre-line; }
  #curtain[data-state="failed"] #curtainMsg { color: #ffb4a8; opacity: 1; }
  /* A stopped pulse is itself part of the failure state: a mark still breathing
     under a failure message reads as "still trying". */
  #curtain[data-state="failed"] #curtainMark { animation: none; opacity: .28; }
  #curtainRetry {
    font: inherit; font-weight: 700; letter-spacing: .04em;
    color: #0b1020; background: #cfd6ea; border: 0; border-radius: 999px;
    padding: 1.1vmin 4vmin; min-height: 44px; min-width: 44px;   /* a real tap target */
    cursor: pointer;
  }
  #curtainRetry:hover { background: #eef2ff; }
  /* The rotate prompt has NO TEXT, by decision (below), so the message column
     is not shown for it either. */
  #curtain[data-reason="orientation"] #curtainSay { display: none; }
  /* The rotate prompt: NO TEXT, by decision — a glyph reads in every language,
     and there is nothing to say that the picture does not. Inline SVG/CSS, no
     asset to ship. Shown only for the orientation reason. */
  #rotateGlyph { display: none; width: 26vmin; height: 26vmin; max-width: 160px; max-height: 160px; }
  #curtain[data-reason="orientation"] #curtainMark { display: none; }
  #curtain[data-reason="orientation"] #rotateGlyph { display: block; }
  #rotateGlyph .phone { transform-origin: 32px 32px; animation: rotate-hint 2.6s ease-in-out infinite; }
  @keyframes rotate-hint {
    0%, 22%   { transform: rotate(0deg); }
    45%, 78%  { transform: rotate(-90deg); }
    100%      { transform: rotate(0deg); }
  }
  /* Reduced motion holds a STATIC glyph rather than dropping the prompt: the
     visitor still has to be told to turn the device. */
  @media (prefers-reduced-motion: reduce) {
    #curtainMark { animation: none; opacity: .8; }
    #rotateGlyph .phone { animation: none; transform: rotate(-45deg); }
  }

  /* --- ?dev=mobile control bar ------------------------------------------------
     Reports the stage the app actually sees and flips its orientation. Outside
     #stage and, like the DEV badge, alive in bare mode — that is exactly when
     you cannot otherwise tell what you are looking at. */
  #devbar {
    position: fixed; left: 8px; bottom: 8px; z-index: 999;
    display: flex; gap: 6px; align-items: center;
    font: 500 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #0d1120e8; border: 1px solid #2a3560; border-radius: 8px; padding: 5px 6px;
  }
  #devbar[hidden] { display: none !important; }
  #devbar button, #devbar select { font-size: 11px; padding: 4px 6px; border-radius: 6px; }
  #devSize { color: #ffd166; letter-spacing: .06em; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 10px 12px;
    background: linear-gradient(#04060fcc, transparent);
    pointer-events: none;
  }
  #hud > * { pointer-events: auto; }
  select, button, label.file {
    background: #141b33; color: #cfd6ea;
    border: 1px solid #2a3560; border-radius: 8px;
    padding: 6px 10px; font-size: 13px; cursor: pointer;
  }
  select:hover, button:hover, label.file:hover { border-color: #4257a0; }
  input[type="file"] { display: none; }
  input[type="range"] { accent-color: #5d79e6; width: 110px; }
  input[type="checkbox"] { accent-color: #5d79e6; }
  .grp { display: flex; align-items: center; gap: 6px; font-size: 12px; opacity: .9; }

  #status {
    position: fixed; bottom: 10px; left: 12px; right: 12px;
    font-size: 12px; opacity: .75; text-align: center;
    text-shadow: 0 1px 3px #000;
  }
  #drop {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: #04060fd0; border: 3px dashed #4257a0;
    font-size: 20px; z-index: 10;
  }

  /* --- sidecar editor panel --- */
  #editor {
    position: fixed; top: 54px; right: 10px; bottom: 42px;
    width: min(440px, calc(100vw - 20px));
    display: none; flex-direction: column; gap: 8px;
    background: #0d1120f2; border: 1px solid #2a3560; border-radius: 10px;
    padding: 10px; z-index: 5;
  }
  #editor.open { display: flex; }
  #editorHead { font-size: 13px; font-weight: 600; }
  #editorHead .name { font-weight: 400; opacity: .7; }
  #editorText {
    flex: 1; resize: none; background: #0a0d18; color: #d8def0;
    border: 1px solid #232c4e; border-radius: 8px; padding: 8px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px;
    line-height: 1.45; tab-size: 2; white-space: pre; overflow: auto;
  }
  #lint { max-height: 30%; overflow: auto; font-size: 12px; line-height: 1.5; }
  #lint .error { color: #ff7a90; }
  #lint .warn { color: #ffc978; }
  #lint .ok { color: #7ce0a3; }
  #editorBtns { display: flex; gap: 8px; flex-wrap: wrap; }

  #links { margin-left: auto; display: flex; gap: 12px; }
  #links a {
    display: inline-flex; align-items: center; gap: 5px;
    color: #8fa1d8; font-size: 12px; text-decoration: none; opacity: .85;
  }
  #links a:hover { opacity: 1; text-decoration: underline; }

  /* Zip (icon pack) mode: the pack owns motion, materials, and framing, so
     the turntable and sidecar controls are hidden — the dropdown carries the
     pack's icons plus its own unload entry. */
  body.zipmode #pivotWrap, body.zipmode #spinWrap, body.zipmode #pauseBtn,
  body.zipmode #sidecarBtn, body.zipmode #ovWrap, body.zipmode #compChip,
  body.zipmode #starsWrap, body.zipmode #bgChip {
    display: none !important;
  }
  /* Sequence transport: shown only while a loaded icon has a sequence. */
  #seqWrap { display: none; }
  #seqWrap button { min-width: 2.4em; padding: 4px 6px; }
  #seqTime { font-variant-numeric: tabular-nums; min-width: 4.5em; }

  /* --- narrow screens (phones): compact HUD + bottom-sheet editor ---------- */
  @media (max-width: 640px) {
    #hud { gap: 8px; padding: 8px; }
    /* Model picker gets its own full-width row; the rest wrap beneath it. */
    #modelSelect { flex: 1 1 100%; }
    /* 16px inputs prevent iOS Safari's auto-zoom on focus; 40px+ = touchable. */
    select, button, label.file { min-height: 40px; font-size: 16px; }
    input[type="range"] { width: 80px; }

    /* Editor becomes a bottom sheet: plays well with the on-screen keyboard
       and leaves the model visible above. dvh tracks the browser's dynamic
       toolbar; safe-area padding keeps buttons off the home indicator. */
    #editor {
      top: auto; left: 0; right: 0; bottom: 0;
      width: auto; height: 70dvh;
      border-radius: 14px 14px 0 0; border-bottom: none;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
    }
    #editorText { font-size: 16px; }
    #editorBtns button { flex: 1; min-height: 44px; }
    #status { bottom: calc(6px + env(safe-area-inset-bottom)); font-size: 11px; }
  }
/* --- bare mode (?ui=0) ------------------------------------------------------
   Hides every viewer control so the page shows only what a pack draws: the
   background layer, the canvas and the sequence overlay. The elements stay in
   the DOM and keep their values, so nothing that reads #speed, #modelSelect or
   the sequence transport has to care. Drag, zoom and taps still work. */
/* --- the viewer's own controls are hidden until asked for -----------------------
   They used to be visible in CSS and hidden by JS, so every load painted them
   for a frame or two before `bare` arrived — a flash that reads as an error,
   and one the curtain could not mask because #hud sits outside its containing
   block. Inverted: nothing shows until the page adds `chrome`. A late reveal is
   invisible; a late hide is what you notice. */
#hud, #status { display: none; }        /* #drop and #editor are already none */
body.chrome #hud { display: flex; }
body.chrome #status { display: block; }

body.bare #hud,
body.bare #status,
body.bare #drop,
body.bare #editor { display: none !important; }

/* --- dev mode (?dev=1) ------------------------------------------------------
   A corner badge, deliberately loud. The whole point of dev mode is that you
   know which rules you are running under; a silent flag would be worse than no
   flag. Survives bare mode, because that is exactly when you cannot otherwise
   tell. */
body.devmode::after {
  content: "DEV";
  position: fixed; right: 8px; bottom: 8px; z-index: 999;
  font: 700 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
  letter-spacing: .12em; padding: 4px 6px; border-radius: 3px;
  color: #0b1020; background: #ffd166; pointer-events: none;
}
</style>
</head>
<body>
<!-- The stage holds everything the app composes. The curtain is INSIDE it, and
     opaque in the initial HTML: it has to be up before the first paint, or the
     flash it exists to hide simply happens sooner. JS lowers it as soon as
     there is something to see. -->
<div id="stage">
  <div id="bg"></div>
  <div id="app"></div>
  <div id="fg"></div>
  <div id="curtain" data-reason="loading">
    <div id="curtainMark"></div>
    <!-- A phone turning, and an arrow saying which way. No text: see the CSS. -->
    <svg id="rotateGlyph" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <path d="M32 6 A26 26 0 0 1 55 20" stroke="#8fa1d8" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M56 12 L56 21 L47 21" stroke="#8fa1d8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <g class="phone">
        <rect x="22" y="14" width="20" height="36" rx="3.5" stroke="#cfd6ea" stroke-width="2.5"/>
        <line x1="29" y1="46" x2="35" y2="46" stroke="#cfd6ea" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </svg>
    <!-- What the curtain says. Empty until there is something honest to say —
         a progress count, a slow note, or a named failure with a retry. -->
    <div id="curtainSay" hidden>
      <p id="curtainMsg" role="status" aria-live="polite"></p>
      <button id="curtainRetry" type="button" hidden>Retry</button>
    </div>
  </div>
</div>

<div id="hud">
  <!-- A row's value is its identity, not its path: the same dragon appears
       twice (with and without a sidecar), and select.value must round-trip to
       the row the user picked. The file to load is data-model. -->
  <select id="modelSelect" title="Pick a bundled model">
    <option value="dragon" data-model="models/DragonAttenuation.glb">Glass dragon (transmission)</option>
    <option value="dragon-emerald" data-model="models/DragonAttenuation.glb" data-sidecar="sidecars/example-emerald-glass.json">Glass dragon + example sidecar (emerald)</option>
    <option value="mosquito" data-model="models/MosquitoInAmber.glb">Mosquito in amber (deep glass volume)</option>
    <option value="vase" data-model="models/GlassVaseFlowers.glb">Glass vase with flowers</option>
    <option value="hurricane" data-model="models/GlassHurricaneCandleHolder.glb">Glass hurricane candle holder</option>
    <option value="dish" data-model="models/IridescentDishWithOlives.glb">Iridescent glass dish</option>
    <option value="dispersion" data-model="models/DispersionTest.glb">Dispersion test (prism glass)</option>
    <option value="helmet" data-model="models/DamagedHelmet.glb">Damaged helmet (PBR classic)</option>
  </select>
  <label class="file">Load .glb / .json / .js / .zip / image…<input type="file" id="filePick" accept=".glb,.gltf,.json,.js,.zip,.png,.jpg,.jpeg,.webp" multiple></label>
  <span class="grp" id="pivotWrap">Pivot
    <select id="pivotSelect" title="Vertical axis the model spins around">
      <option value="center">Center (bounding box)</option>
      <option value="origin">As exported (model origin)</option>
    </select>
  </span>
  <span class="grp" id="spinWrap">Spin <input type="range" id="speed" min="0" max="3" step="0.05" value="0.3"></span>
  <button id="pauseBtn" title="Pause / resume spin">Pause</button>
  <button id="sidecarBtn" title="View / edit the sidecar JSON">Sidecar…</button>
  <label class="grp" id="ovWrap" style="display:none" title="Toggle the loaded sidecar's material settings">
    <input type="checkbox" id="ovToggle" checked> Apply sidecar settings
  </label>
  <label class="grp" id="starsWrap" title="Default starfield backdrop (synthetic, generated for this project)"><input type="checkbox" id="starsToggle" checked> Stars</label>
  <button id="bgChip" style="display:none" title="Remove the custom background"><span id="bgName"></span> ✕</button>
  <button id="compChip" style="display:none" title="Unload the custom component"><span id="compName"></span> ✕</button>
  <span class="grp" id="seqWrap" title="Scrub the loaded sequence (dragging pauses it)">
    <button id="seqPlay" title="Play / pause the sequence">⏸</button>
    <input type="range" id="seqScrub" min="0" max="1" step="0.01" value="0">
    <span id="seqTime">0.00 s</span>
  </span>
  <span id="links">
    <a href="https://github.com/ericwastaken/glb-turntable-viewer" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      Fork me on GitHub</a>
    <a href="https://github.com/ericwastaken/glb-turntable-viewer#readme" target="_blank" rel="noopener">

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "js-yaml": "./vendor/js-yaml.esm.min.mjs",
    "animejs": "./vendor/animejs.esm.min.js",

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/loaders/GLTFLoader.js';
import { OrbitControls } from './vendor/controls/OrbitControls.js';
import { RoomEnvironment } from './vendor/environments/RoomEnvironment.js';

const app = document.getElementById('app');
const status = document.getElementById('status');
const $ = id => document.getElementById(id);

// --- URL parameters ------------------------------------------------------
// Read once, here, because the stage below needs ?dev= before anything is
// sized. The rest of the parameters are consumed by the boot block at the
// bottom of this file (AGENT.md §4).
const params = new URLSearchParams(location.search);
// ?ui=0 (also: none/off/false/hide) strips the viewer's own controls, leaving
// just the pack's own picture. Anything else, or absent, keeps the full UI.
const UI_OFF = /^(0|none|off|false|hide)$/i;
const uiParam = (params.get('ui') || '').trim();
if (UI_OFF.test(uiParam)) document.body.classList.add('bare');
// Show the controls only when this is the viewer being used as a tool. Loading a
// pack or a component is someone SHOWING something, so it stays clean unless
// ?ui=1 asks otherwise. Set before first paint, so nothing is ever un-shown.
const wantsChrome = UI_OFF.test(uiParam) ? false
  : (uiParam !== '' ? true : !params.get('component'));
if (wantsChrome) document.body.classList.add('chrome');

// ?dev=… — author mode. It cannot disable caching wholesale: index.html and the
// statically imported vendor modules are already fetched before any of this
// runs, and only a no-store SERVER reaches those (see .claude/launch.json's
// "viewer-dev"). What it does reach is everything loaded after boot, plus the
// saved resume state — the other thing that quietly serves you yesterday's
// answer.
//   ?dev=1        sequence.js always re-fetched; a pack's saved step is ignored
//   ?dev=all      …and the pack loader and every icon module too. That
//                 re-downloads the whole pack on every reload — megabytes — so
//                 it is opt-in.
//   ?dev=mobile   …plus the phone-sized emulated stage (see `stage` below).
// The flags COMPOSE, comma-separated: ?dev=mobile,all is both.
const devFlags = new Set((params.get('dev') || '').trim().toLowerCase().split(',').map(s => s.trim()).filter(Boolean));
const DEV = devFlags.size > 0 && ![...devFlags].every(f => /^(0|off|false|no)$/.test(f));
const DEV_ALL = DEV && devFlags.has('all');
const DEV_MOBILE = DEV && devFlags.has('mobile');
// A token, not `cache: 'reload'`: a dynamic import() takes no cache option, and
// a module is only re-evaluated when its URL itself differs. `?dev=all` extends
// it to the PACK — its loader and every icon module — which §4 has always
// promised and, until this was parameterised, nothing actually did.
const devBust = (on = DEV) => (on ? `?dev=${Date.now()}` : '');
// One id for a whole page load, so a pack's loader and its icon modules are
// busted together rather than each getting a different URL. packToken() below
// turns it into the query a pack's modules actually carry.
const DEV_PACK_ID = DEV_ALL ? Date.now().toString(36) : '';
if (DEV) {
  document.body.classList.add('devmode');
  console.info(`[viewer] dev mode${DEV_ALL ? ' (all)' : ''}${DEV_MOBILE ? ' (mobile stage)' : ''}: sequence runtime uncached, saved step ignored${DEV_ALL ? ', pack modules uncached' : ''}. index.html and vendor/ still come from the browser cache — use the viewer-dev server for those.`);
}
if (DEV_MOBILE) document.body.classList.add('devstage');

// --- stage (the box the app composes against) ----------------------------
// ONE source for "how big is the picture, and which way up is it". The
// renderer size, the camera aspect, the ring anchoring, the pointer hit test,
// the glyph capture, the drag-to-turn distance and a sequence's own portrait
// overrides all read THIS, and nothing downstream reads innerWidth /
// innerHeight. That is what lets ?dev=mobile substitute a phone-sized box and
// still exercise the very code paths a real device takes — a lock or a layout
// that only worked in the emulator would be worse than none.
//
// ORIENTATION IS DECIDED BY ASPECT RATIO, never by screen.orientation or the
// Screen Orientation API. A resized desktop window, the emulator and a real
// phone then behave identically, and mobile Safari has no such API to read
// anyway (which is also why the rotation lock is advisory — §12.14). A square
// stage counts as landscape.
const stageEl = $('stage');
const stage = {
  w: 1, h: 1, left: 0, top: 0,
  get portrait() { return this.h > this.w; },
  get orientation() { return this.h > this.w ? 'portrait' : 'landscape'; },
  get emulated() { return DEV_MOBILE; },
};
// Common phone/tablet boxes. The first is the reference portrait phone the
// overlay sizing was measured against.
const DEV_PRESETS = [[375, 812], [390, 844], [414, 896], [360, 800], [768, 1024]];
const devStage = { w: 375, h: 812, flipped: false };
const stageWatchers = [];
const onStage = fn => { stageWatchers.push(fn); };

function measureStage() {
  const vw = Math.max(1, innerWidth), vh = Math.max(1, innerHeight);
  if (DEV_MOBILE) {
    const [ww, hh] = devStage.flipped ? [devStage.h, devStage.w] : [devStage.w, devStage.h];
    // CLAMPED to the window, never scaled with a transform. A scaled stage
    // would put pointer coordinates and the overlay's own client rects in a
    // different space from the stage the app measures, and two coordinate
    // systems is precisely the class of bug this accessor exists to prevent.
    // The devbar reports what the stage actually ended up being.
    stage.w = Math.min(ww, vw); stage.h = Math.min(hh, vh);
    stageEl.style.width = `${stage.w}px`;
    stageEl.style.height = `${stage.h}px`;
    // The overlay's type unit follows the emulated box, not the window.
    stageEl.style.setProperty('--vmin', `${Math.min(stage.w, stage.h) / 100}px`);
  } else {
    stage.w = vw; stage.h = vh;
    stageEl.style.width = stageEl.style.height = '';
    stageEl.style.removeProperty('--vmin');   // back to the stylesheet's 1vmin
  }
  const r = stageEl.getBoundingClientRect();
  stage.left = r.left; stage.top = r.top;
  return stage;
}
// Client (window) coordinates -> stage coordinates. Pointer events are always
// in window space; everything the app measures is in stage space.
const toStageX = cx => cx - stage.left;
const toStageY = cy => cy - stage.top;

// Re-measure and push the new stage everywhere: the renderer, the camera, and
// every watcher (the orientation lock, the devbar readout, a live sequence's
// portrait overrides). ONE entry point, so a window resize, a device rotation
// and the emulator's own controls cannot possibly diverge.
function applyStage() {
  measureStage();
  camera.aspect = stage.w / stage.h;
  camera.updateProjectionMatrix();
  renderer.setSize(stage.w, stage.h);
  for (const fn of stageWatchers) { try { fn(stage); } catch (e) { console.error('stage watcher:', e); } }
}

// --- renderer / scene / camera -------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
measureStage();
renderer.setSize(stage.w, stage.h);
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // needed for glass to look right
renderer.toneMappingExposure = 1.0;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// Image-based lighting so PBR + transmission materials read correctly,
// without shipping an HDRI file: RoomEnvironment is generated procedurally.
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, stage.w / stage.h, 0.01, 100);
camera.position.set(0, 0.6, 3);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
// `enableZoom` stays at OrbitControls' own default (true) for a plain model.
// A pack SEQUENCE declares what it wants with `input:` (§12.13) — until this
// was added, nothing in the app referenced enableZoom at all, so scroll and
// pinch dollied the camera even in pack mode, where a fixed composed frame is
// the whole point. Nobody had chosen that.

// A subtle key light on top of the IBL, for a little sparkle.
const key = new THREE.DirectionalLight(0xffffff, 1.2);
key.position.set(3, 5, 4);
scene.add(key);

// --- background layer --------------------------------------------------------
// The backdrop lives in #bg behind the transparent canvas. Default image:
// backgrounds/starfield-default.jpg — a synthetic starfield generated for
// this project (no external assets, no licenses to credit).
const DEFAULT_BG = './backgrounds/starfield-default.jpg';
const bgEl = $('bg');
const bgState = { stars: true, custom: null, customName: '' };   // the user's choice
let componentBg = null;                                          // a loaded component/pack's choice wins
function applyBackground() {
  const bg = componentBg
    ?? (bgState.custom ? { image: bgState.custom } : (bgState.stars ? { image: DEFAULT_BG } : null));
  bgEl.style.backgroundImage = bg?.image ? `url("${bg.image}")` : 'none';
  bgEl.style.backgroundColor = bg?.color ?? 'transparent';
}
function setCustomBackground(url, name) {
  if (bgState.custom?.startsWith('blob:')) URL.revokeObjectURL(bgState.custom);
  bgState.custom = url || null; bgState.customName = name || '';
  $('bgName').textContent = name || '';
  $('bgChip').style.display = url ? 'inline-block' : 'none';
  applyBackground();
}
$('starsToggle').onchange = e => { bgState.stars = e.target.checked; applyBackground(); };
$('bgChip').onclick = () => setCustomBackground(null, '');
applyBackground();

// --- the curtain -------------------------------------------------------------
// One opaque layer over the stage, raised for a REASON. It is already up in the
// initial HTML (a curtain added after JS boots only moves the flash earlier),
// and it comes down when the first thing worth seeing is posed.
//
// Two reasons today. They are tracked independently and the layer shows the
// most urgent one, because they genuinely overlap: a phone held the wrong way
// while a pack is still loading needs the rotate prompt, not a pulse.
const curtainEl = $('curtain'), curtainMark = $('curtainMark');
const curtainSay = $('curtainSay'), curtainMsg = $('curtainMsg'), curtainRetry = $('curtainRetry');
const curtainWhy = new Set(['loading']);
const CURTAIN_ORDER = ['orientation', 'loading'];
function curtainSync() {
  const why = CURTAIN_ORDER.find(r => curtainWhy.has(r)) ?? null;
  if (why) curtainEl.dataset.reason = why;
  curtainEl.hidden = !why;
}
let curtainRetryFn = null;
curtainRetry.onclick = () => {
  const f = curtainRetryFn;
  curtainRetryFn = null;
  // Every press moves the URL token on, or the retried import re-attaches to
  // the module map's record of the one that stalled — see packToken().
  if (f) { loadMon.again(); f(); }
};
const curtain = {
  raise(why) { curtainWhy.add(why); curtainSync(); },
  // A NAMED load failure keeps the curtain up. Every failure path in the page
  // lowers it so a visitor is not left staring at an opaque layer — but an
  // opaque layer that says which resource never arrived, and offers a retry, is
  // more use than a blank page with nothing on it to act on.
  clear(why) {
    if (why === 'loading' && curtainEl.dataset.state === 'failed') return;
    curtainWhy.delete(why); curtainSync();
    if (why === 'loading') this.say(null, null);
  },
  get up() { return !curtainEl.hidden; },
  get reason() { return curtainEl.hidden ? null : curtainEl.dataset.reason; },
  get state() { return curtainEl.dataset.state || null; },
  get message() { return curtainSay.hidden ? null : curtainMsg.textContent; },
  // The DEFAULT text the curtain shows while loading, which a pack may replace
  // with `loading: { message: … }`. Deliberately NOT called `message`: that is
  // the getter above, reporting what the curtain is actually showing now. They
  // answer different questions, and while both were called `message` the data
  // property shadowed the getter — so `viewer.curtain.message` reported the
  // default forever, including while the curtain displayed a load failure.
  // A visitor is owed plain language, not the name of a module; resource names
  // belong in the slow and failed states (and in ?dev=), where they act on it.
  defaultMessage: 'Loading…',
  appearance(decl) {
    const m = typeof decl?.message === 'string' ? decl.message.trim() : '';
    this.defaultMessage = m || 'Loading…';
    curtainEl.style.background = decl?.ground ? String(decl.ground) : '';
    curtainMark.style.backgroundImage = decl?.image ? `url("${decl.image}")` : '';
    // With an image of its own the default's inset ring would frame it oddly.
    curtainMark.style.boxShadow = decl?.image ? 'none' : '';
    curtainEl.dataset.anim = decl?.animation === 'none' ? 'none' : 'pulse';
  },
  // The only way text reaches the curtain. `state` is loading | slow | failed;
  // a null text clears the column back to the quiet pulse.
  say(state, text, retry) {
    curtainRetryFn = retry ?? null;
    curtainRetry.hidden = !retry;
    if (!text) {
      curtainSay.hidden = true; curtainMsg.textContent = '';
      delete curtainEl.dataset.state;
      return;
    }
    curtainEl.dataset.state = state || 'loading';
    curtainMsg.textContent = text;
    curtainSay.hidden = false;
  },
};

// --- the load monitor --------------------------------------------------------
// Every network read in the load path is registered here, and this is what
// decides whether the curtain is quiet, is saying "still going", or has given
// up and named the thing that never arrived.
//
// It exists because NOTHING in the load path had a deadline. A relayed link
// that accepts a connection and then never answers left `fetch()` and
// `import()` promises that simply never settled: nothing failed, so nothing was
// reported, so the curtain stayed up for ever with no message at all.
//
// Two thresholds rather than one, because SLOW and FAILED are different things
// to say to a visitor: the first admits we are still waiting and names what on,
// the second stops waiting and offers a retry. Both are declarable per pack in
// icons.yml's `loading:` block (AGENT.md §7).
const LOAD_DEFAULTS = { slowAfter: 15, failAfter: 45 };   // seconds
const loadMon = (() => {
  let limits = { ...LOAD_DEFAULTS };
  let expected = 0, done = 0;
  const live = new Map();          // label -> { t0, timer }
  let slowLabel = null, failure = null, retry = null;
  const log = [];                  // dev-mode phase timings
  // True until the first draw is complete. After that the pack is still
  // fetching — the deferred preload — but the visitor is looking at a working
  // page, so those reads are still timed and still deadlined and are simply not
  // narrated. A slow third icon must not put a warning over a live step 1.
  let foreground = true;
  // How many times the CURRENT load has been retried — 0 for a first attempt,
  // which is the common case and must leave every URL alone. It is a URL token,
  // not a statistic: see packToken().
  let retries = 0;
  // The status line can also be held by something that is not a load failure —
  // a sequence that would not compile, say — so the monitor only ever releases
  // a hold it put there itself.
  let mine = false;
  const hold = text => { mine = true; holdStatus(text); };
  const unhold = () => { if (mine) { mine = false; releaseStatus(); } };

  const plural = () => (expected ? ` ${Math.min(done + 1, expected)} of ${expected}` : '');

  function paint() {
    if (!foreground) return;
    if (failure) {
      const text = `Could not load ${failure.label}.\n${failure.detail}`;
      // Raised, not merely restyled: a failure has to be visible even when the
      // curtain had already come down (a later icon picked from the dropdown),
      // and in bare mode there is no status line to fall back on.
      curtain.raise('loading');
      curtain.say('failed', text, retry ? () => retry() : null);
      hold(`Could not load ${failure.label} — ${failure.detail}`);
      return;
    }
    if (slowLabel) {
      const text = DEV
        ? `Still loading${plural()} — waiting on ${slowLabel}. This connection is slow.`
        : `Still loading${plural()}. This connection is slow.`;
      curtain.say('slow', text);
      hold(text);
      return;
    }
    // Always something readable, from the first frame: a silent curtain is what
    // made a stalled load indistinguishable from a dead page.
    const label = live.keys().next().value;
    curtain.say('loading', DEV && label ? `${curtain.defaultMessage} (${label})` : curtain.defaultMessage);
  }

  // A phase's timing line. Off outside ?dev= — this is an author's tool, and a
  // visitor's console is not the place to publish a load profile.
  function note(label, ms, how) {
    log.push({ label, ms: +ms.toFixed(1), how });
    if (DEV) console.info(`[load] ${how.padEnd(6)} ${ms.toFixed(1).padStart(8)} ms  ${label}`);
  }

  return {
    limits: () => limits,
    get log() { return log.slice(); },
    // The pack's own thresholds, applied the moment its manifest is parsed —
    // so everything after the manifest (the sequence, the icon modules, the
    // background) is judged by the pack's numbers, and only the manifest fetch
    // itself is judged by the viewer's. There is no way round that ordering:
    // the file that declares them is the file we are waiting for.
    declare(d) {
      if (Number.isFinite(d?.slowAfter)) limits.slowAfter = d.slowAfter;
      if (Number.isFinite(d?.failAfter)) limits.failAfter = d.failAfter;
      if (DEV) console.info(`[load] limits: slowAfter ${limits.slowAfter}s, failAfter ${limits.failAfter}s`);
    },
    // "n more resources are needed before the first draw." Called by whoever
    // knows — the pack loader for the pack's files, the viewer for the
    // background — so the count is assembled honestly rather than guessed.
    expect(n) { expected += Math.max(0, n | 0); paint(); },
    get retries() { return retries; },
    // Another go at something that already failed — the Retry button, or a
    // later icon being asked for a second time. It only has to move the URL
    // token on (see packToken), so the import is not handed the module map's
    // record of the stalled one.
    again() { retries++; },
    // A fresh load. `next` is what the Retry button re-runs. This does NOT
    // touch the retry count: a new load of a different thing starts at zero, so
    // ordinary URLs stay ordinary and stay cacheable.
    reset(next) {
      for (const r of live.values()) clearTimeout(r.timer);
      live.clear(); log.length = 0;
      expected = 0; done = 0; slowLabel = null; failure = null;
      retry = next ?? null;
      foreground = true;
      limits = { ...LOAD_DEFAULTS };
      unhold();
      paint();
    },
    // Register one resource. The returned token MUST be settled.
    begin(label, counted = true) {
      const t0 = performance.now();
      const rec = { t0, timer: setTimeout(() => { slowLabel = label; paint(); }, limits.slowAfter * 1000) };
      live.set(label, rec);
      paint();
      const settle = () => {
        clearTimeout(rec.timer);
        live.delete(label);
        if (slowLabel === label) slowLabel = live.keys().next().value ?? null;
      };
      return {
        ok() { settle(); if (counted) done++; note(label, performance.now() - t0, 'ok'); paint(); },
        fail(detail) {
          settle();
          note(label, performance.now() - t0, 'FAIL');
          failure = { label, detail: detail || 'it did not arrive' };
          paint();
        },
      };
    },
    // Everything the first draw needed is here: stop talking.
    settle() {
      for (const r of live.values()) clearTimeout(r.timer);
      live.clear(); slowLabel = null;
      foreground = false;
      // A load that came good takes the retry token back off: the URLs that
      // follow (the deferred preload) are ordinary again, and stay cacheable.
      if (!failure) { retries = 0; unhold(); curtain.say(null, null); }
      if (DEV && log.length) console.info(`[load] first draw complete — ${log.length} phase(s), ${log.reduce((a, e) => a + e.ms, 0).toFixed(1)} ms of tracked waiting`);
    },
    get failed() { return failure ? { ...failure } : null; },
  };
})();

// A message refreshStatus() must not erase. A load failure used to be written
// straight to #status and then quietly overwritten by the next refreshStatus()
// a few lines later — the exact bug that left a sequence error named only in
// the console while AGENT.md §9 promised the status line would carry it.
let statusHold = null;
function holdStatus(text) { statusHold = text; status.textContent = text; }
function releaseStatus() { if (statusHold !== null) { statusHold = null; refreshStatus(); } }

// --- retry tokens ------------------------------------------------------------
// A dynamic import() is keyed BY URL in the browser's module map, and a stalled
// one leaves a PENDING record there for ever. Retrying the same URL therefore
// re-attaches to the same dead promise and never issues a second request —
// measured: one request in the server log for two attempts, the second failing
// at the same deadline while the server was already answering. So every retry
// carries a token that makes the URL different.
//
// `?dev=all` (§4) wants the same thing for a different reason, and shares it.
function packToken() {
  const q = [];
  if (DEV_PACK_ID) q.push(`dev=${DEV_PACK_ID}`);
  if (loadMon.retries) q.push(`retry=${loadMon.retries}`);
  return q.length ? `?${q.join('&')}` : '';
}
// The same, for the modules the VIEWER itself imports mid-load.
const retryQ = () => (loadMon.retries ? `?retry=${loadMon.retries}` : '');

// --- deadlines on the viewer's own reads -------------------------------------
// The pack loader carries its own copy of these (components/pack.component.js);
// it is a standalone file every pack copies in and cannot import from here.
// These three are for the reads the VIEWER makes: the component module, the
// sequence runtime, and a component's background image.

// A dynamic import() CANNOT be aborted, so its deadline is a race: the module
// may still turn up later, but the load stops waiting on it and says which one
// it was. That is the whole difference between a reported failure and a hang.
function withDeadline(promise, label, counted = true) {
  const t = loadMon.begin(label, counted);
  const secs = loadMon.limits().failAfter;
  let timer;
  return Promise.race([
    promise,
    new Promise((_, rej) => { timer = setTimeout(() => rej(new Error(`no response within ${secs}s`)), secs * 1000); }),
  ]).then(
    v => { clearTimeout(timer); t.ok(); return v; },
    e => { clearTimeout(timer); t.fail(e.message ?? String(e)); throw e; },
  );
}

// A background is a CSS background-image, so nothing in the page ever waited
// for it: the curtain came up on a lit icon over a bare ground and the backdrop
// faded in seconds later. Decoding it here makes the FIRST DRAW COMPLETE, and
// puts the backdrop on the same deadline as everything else.
function awaitImage(url, label) {
  const img = new Image();
  // `load`, not `decode()`: decode() is allowed to sit on a page that is not
  // being painted, and an automation pane or a backgrounded tab is exactly
  // that (§10.1). `load` fires as soon as the bytes are in and the image is
  // usable, which is the thing the curtain is actually waiting for.
  const arrived = new Promise((res, rej) => {
    img.onload = () => res();
    img.onerror = () => rej(new Error('the image could not be loaded'));
  });
  img.src = url;
  return withDeadline(arrived, label);
}

// --- the first draw ----------------------------------------------------------
// The line between "what step 1 needs" and "everything else". Anything the
// visitor cannot see yet waits on this promise, so the bytes the curtain is
// actually waiting for do not have to share the link with the rest of the pack.
let firstDrawDone = null;
let firstDraw = Promise.resolve();
function resetFirstDraw() { firstDraw = new Promise(r => { firstDrawDone = r; }); }
function markFirstDraw() {
  const done = firstDrawDone;
  if (!done) return;
  firstDrawDone = null;
  let fired = false;
  const go = () => { if (!fired) { fired = true; done(); } };
  // Two frames, so the curtain is not merely lowered but actually painted over.
  requestAnimationFrame(() => requestAnimationFrame(go));
  // …and a timer behind it, because rAF is PAUSED in a hidden or headless pane
  // (§10.1). A check that never preloaded would be a worse bug than one that
  // preloads a quarter of a second early.
  setTimeout(go, 250);
}

// --- input policy (a sequence's `input:` block — AGENT.md §12.13) ------------
// zoom / drag / swipe are DECLARED rather than accumulated. Before this they
// were scattered and partly accidental: `enableZoom` was referenced nowhere, so
// a scroll dollied the camera even in pack mode, and camera rotation was
// switched off unconditionally the moment a sequence attached its router.
const INPUT_OFF = { zoom: true, drag: 'camera' };   // no sequence: the viewer's own defaults
function applyInput(p) {
  controls.enableZoom = !!p.zoom;
  controls.enableRotate = p.drag === 'camera';
  // The status line says what a gesture does, so it has to follow a per-step
  // override rather than describing the pack once at load.
  refreshStatus();
}

// --- orientation lock (advisory — AGENT.md §12.14) ---------------------------
// A sequence may declare the orientation it was composed for. On a mismatch the
// curtain goes up, the rotate glyph plays, and the sequence is HELD — it must
// not walk on to the next step behind an opaque layer.
//
// It is ADVISORY and cannot be anything else. screen.orientation.lock() needs
// fullscreen and does not exist in mobile Safari at all, so there is no code
// path here that turns a device: we detect, and we prompt. iOS Safari is the
// case that shapes the design, not an afterthought.
//
// The decision is `stage.orientation` — an ASPECT RATIO — so a resized desktop
// window, ?dev=mobile and a real phone all behave identically.
const ORIENTATIONS = ['portrait', 'landscape', 'any'];
// ?orientation= is the viewer-level override: it wins over whatever the pack
// declared, and `any` is how you switch the lock off to review the other way up.
const orientParam = (params.get('orientation') || '').trim().toLowerCase();
const orientOverride = ORIENTATIONS.includes(orientParam) ? orientParam
  : (/^(0|off|false|no)$/.test(orientParam) ? 'any' : null);
let seqOrientation = 'any';     // what the loaded sequence asked for
let orientationHold = false;    // the render loop's gate
function wantedOrientation() { return orientOverride ?? seqOrientation; }
function evaluateOrientation() {
  const want = wantedOrientation();
  const bad = want !== 'any' && stage.orientation !== want;
  if (bad === orientationHold) return;
  orientationHold = bad;
  if (bad) curtain.raise('orientation'); else curtain.clear('orientation');
  // hold(), not pause(): pause()'s partner play() restarts a phase that has
  // reached `end: hold`, and coming back from a rotation must resume at exactly
  // the same time and step.
  component?.seq?.hold?.(bad);
  syncSequenceUI();
}
function setSequenceOrientation(v) { seqOrientation = v ?? 'any'; evaluateOrientation(); }
onStage(evaluateOrientation);

// --- ?dev=mobile control bar -------------------------------------------------
// It flips the SIMULATED orientation through the same accessor a real device
// changes (`stage`), so nothing downstream can tell the two apart.
if (DEV_MOBILE) {
  const bar = $('devbar'), sizeEl = $('devSize'), preset = $('devPreset');
  bar.hidden = false;
  for (const [w, h] of DEV_PRESETS) {
    const o = document.createElement('option');
    o.value = `${w}x${h}`; o.textContent = `${w}×${h}`;
    preset.appendChild(o);
  }
  preset.value = `${devStage.w}x${devStage.h}`;
  const report = () => { sizeEl.textContent = `${stage.w}×${stage.h} ${stage.orientation}`; };
  preset.onchange = () => {
    const [w, h] = preset.value.split('x').map(Number);
    devStage.w = w; devStage.h = h;
    applyStage();
  };
  $('devFlip').onclick = () => { devStage.flipped = !devStage.flipped; applyStage(); };
  onStage(report);
  report();   // the bar has to say something before the first resize
  // The wheel is mapped onto the SWIPE channel so the gesture can be exercised
  // with a trackpad or a mouse. It goes through the sequence's own classifier —
  // there is no second gesture implementation to drift out of step.
  addEventListener('wheel', e => {
    const r = component?.seq?.router;
    if (!r?.wheel) return;
    r.wheel(e.deltaY);
  }, { passive: true });
}

// --- model + pivot ----------------------------------------------------------
// The model is parented under a pivot group at the world origin. The spin is
// applied to the pivot, so wherever we position the model inside it defines
// the rotation axis. "Center" mode puts the vertical axis exactly through the
// middle of the visible bounding box; "origin" keeps the axis where the file's
// author put the model origin. ?pivot=x,y,z (model units) overrides both.
const pivot = new THREE.Group();
scene.add(pivot);

const loader = new GLTFLoader();
let current = null;      // THREE.Group holding the loaded model
let mixer = null;        // plays animations embedded in the GLB, if any
let animCount = 0;       // how many clips we started on it (the mixer's own
                         // action list is private, so we keep the count)
let baseLabel = '';

const pivotParam = (params.get('pivot') || '').split(',').map(Number);
const manualPivot = pivotParam.length === 3 && pivotParam.every(Number.isFinite)
  ? new THREE.Vector3(...pivotParam) : null;

function chainVisible(o, root) {
  for (let p = o; p; p = p.parent) { if (!p.visible) return false; if (p === root) break; }
  return true;
}

function visibleBox(obj) {
  const box = new THREE.Box3();
  obj.updateWorldMatrix(true, true);
  obj.traverse(o => {
    if (o.isMesh && chainVisible(o, obj)) box.union(new THREE.Box3().setFromObject(o));
  });
  if (box.isEmpty()) box.setFromObject(obj);
  return box;
}

function applyPivot() {
  if (!current) return;
  // Measure with the spin zeroed: a rotated pivot would skew the bounding box
  // and produce a wrong offset.
  const rotY = pivot.rotation.y;
  pivot.rotation.set(0, 0, 0);
  current.position.set(0, 0, 0);
  const box = visibleBox(current);
  const center = box.getCenter(new THREE.Vector3());
  if (manualPivot) {
    current.position.copy(manualPivot).negate();
  } else if ($('pivotSelect').value === 'center') {
    current.position.copy(center).negate();   // spin axis through bbox center
  } // 'origin': leave at 0,0,0 — spin around the authored origin
  frameCamera();                               // frame while still unrotated
  pivot.rotation.y = rotY;                     // resume the spin where it was
}

function frameCamera() {
  const box = visibleBox(pivot);
  const size = box.getSize(new THREE.Vector3()).length();
  const center = box.getCenter(new THREE.Vector3());
  const dist = size * 1.95;  // start small: model ~35% of viewport height
  camera.position.set(center.x, center.y + size * 0.15, center.z + dist);
  camera.near = size / 100; camera.far = size * 20;
  camera.updateProjectionMatrix();
  controls.target.copy(center);
  controls.update();
}

// --- sidecar material settings ----------------------------------------------
// Effects that don't survive a glTF export (e.g. glass/transmission looks) are
// described in a sidecar JSON. The sidecar is EXPLICIT: pass it with
// ?sidecar=path/to/file.json, pick it in the file dialog (multi-select with
// the model), or drag-drop it — any filename works, and one sidecar can serve
// several models. It stays loaded across model switches until cleared.
// Schema: { "materials": { "<mesh name>" | "*": { MeshPhysicalMaterial props,
// colors as hex strings } } }. Keys starting with "_" are comments.
let sidecarSpec = null;
let sidecarName = '';
const originalMats = new Map();   // mesh -> material as exported
const overrideMats = new Map();   // mesh -> sidecar-built material

const COLOR_PROPS = new Set(['color', 'attenuationColor', 'emissive', 'sheenColor', 'specularColor']);
function buildMaterial(spec) {
  const m = new THREE.MeshPhysicalMaterial();
  for (const [k, v] of Object.entries(spec)) {
    if (k.startsWith('_')) continue;
    if (COLOR_PROPS.has(k)) m[k] = new THREE.Color(v);
    else if (k in m) m[k] = v;
  }
  return m;
}

// An entry with no (non-comment) properties is a no-op placeholder: it names
// the mesh without overriding it, and "*" (if it has properties) applies.
const hasProps = s => !!s && Object.keys(s).some(k => !k.startsWith('_'));

function prepareSidecar() {
  overrideMats.clear();
  if (sidecarSpec?.materials && current) {
    const star = sidecarSpec.materials['*'];
    current.traverse(o => {
      if (!o.isMesh) return;
      const named = sidecarSpec.materials[o.name];
      const spec = hasProps(named) ? named : (hasProps(star) ? star : null);
      if (spec) overrideMats.set(o, buildMaterial(spec));
    });
  }
  $('ovWrap').style.display = overrideMats.size ? 'flex' : 'none';
  applySidecar(overrideMats.size ? $('ovToggle').checked : false);
}

function applySidecar(on) {
  if (current) current.traverse(o => {
    if (!o.isMesh) return;
    o.material = (on && overrideMats.get(o)) || originalMats.get(o) || o.material;
  });
  refreshStatus();
}

function setSidecar(spec, name) {
  sidecarSpec = spec;
  sidecarName = name;
  prepareSidecar();
  if (editor.classList.contains('open')) openEditor();   // refresh editor view
}

async function loadSidecarURL(url) {
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const res = lintSidecar(await r.text());
    setSidecar(res.spec ?? null, url.split('/').pop());
    if (!res.ok) status.textContent = `Sidecar ${url} has errors — open Sidecar… to review.`;
  } catch (err) { status.textContent = `Could not load sidecar ${url}: ${err.message}`; }
}

// --- sidecar linter -----------------------------------------------------------
// Two layers: valid JSON, then valid-for-three.js (known MeshPhysicalMaterial
// properties, right value types, mesh names that exist in the current model).
const PROP_TYPES = {
  color:'color', metalness:'unit', roughness:'unit', transmission:'unit',
  thickness:'number', ior:'number', attenuationColor:'color',
  attenuationDistance:'number', clearcoat:'unit', clearcoatRoughness:'unit',
  emissive:'color', emissiveIntensity:'number', iridescence:'unit',
  iridescenceIOR:'number', sheen:'unit', sheenColor:'color',
  sheenRoughness:'unit', specularColor:'color', specularIntensity:'unit',
  opacity:'unit', transparent:'boolean', envMapIntensity:'number',
  flatShading:'boolean', wireframe:'boolean', reflectivity:'unit',
  dispersion:'number', anisotropy:'number', anisotropyRotation:'number',
};

function lintSidecar(text) {
  let spec;
  try { spec = JSON.parse(text); }
  catch (e) { return { ok: false, msgs: [{ lvl: 'error', msg: 'Invalid JSON: ' + e.message }] }; }
  const msgs = [];
  if (typeof spec !== 'object' || spec === null || Array.isArray(spec))
    return { ok: false, msgs: [{ lvl: 'error', msg: 'Root must be a JSON object.' }] };
  for (const k of Object.keys(spec))
    if (k !== 'materials' && !k.startsWith('_'))
      msgs.push({ lvl: 'warn', msg: `Unknown root key "${k}" (only "materials" is used; "_..." keys are comments).` });
  if (!spec.materials || typeof spec.materials !== 'object' || Array.isArray(spec.materials)) {
    msgs.push({ lvl: 'error', msg: 'Missing "materials" object at the root.' });
    return { ok: false, msgs, spec };
  }
  const meshNames = new Set();
  current?.traverse(o => { if (o.isMesh && o.name) meshNames.add(o.name); });
  for (const [target, props] of Object.entries(spec.materials)) {
    if (target.startsWith('_')) continue;
    if (typeof props !== 'object' || props === null || Array.isArray(props)) {
      msgs.push({ lvl: 'error', msg: `"${target}" must map to an object of material properties.` });
      continue;
    }
    if (target !== '*' && meshNames.size && !meshNames.has(target))
      msgs.push({ lvl: 'warn', msg: `"${target}" doesn't match any mesh in the current model (meshes: ${[...meshNames].join(', ')}).` });
    if (Object.keys(props).every(k => k.startsWith('_')))
      msgs.push({ lvl: 'warn', msg: `"${target}" has no properties — it's a no-op placeholder${target === '*' ? '' : '; "*" (if it has properties) applies to this mesh'}.` });
    for (const [k, v] of Object.entries(props)) {
      if (k.startsWith('_')) continue;
      const t = PROP_TYPES[k];
      if (!t) { msgs.push({ lvl: 'warn', msg: `"${k}" is not a known MeshPhysicalMaterial property (threejs.org/docs → MeshPhysicalMaterial).` }); continue; }
      if (t === 'color' && !(typeof v === 'number' || (typeof v === 'string' && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v))))
        msgs.push({ lvl: 'error', msg: `"${k}" must be a hex color string like "#cfc6e8" (got ${JSON.stringify(v)}).` });
      else if ((t === 'number' || t === 'unit') && typeof v !== 'number')
        msgs.push({ lvl: 'error', msg: `"${k}" must be a number (got ${JSON.stringify(v)}).` });
      else if (t === 'unit' && typeof v === 'number' && (v < 0 || v > 1))
        msgs.push({ lvl: 'warn', msg: `"${k}" is usually between 0 and 1 (got ${v}).` });
      else if (t === 'boolean' && typeof v !== 'boolean')
        msgs.push({ lvl: 'error', msg: `"${k}" must be true or false (got ${JSON.stringify(v)}).` });
    }
  }
  return { ok: !msgs.some(m => m.lvl === 'error'), msgs, spec };
}

// --- sidecar editor UI ---------------------------------------------------------
const editor = $('editor');
const editorText = $('editorText');

// With no sidecar loaded, the editor opens on a skeleton generated from the
// current model: "*" with starter properties, then every mesh identified by
// name with an empty (no-op) object, ready to be filled in.
function buildSkeleton() {
  const mats = { '*': { color: '#ffffff', metalness: 0, roughness: 0.5 } };
  current?.traverse(o => { if (o.isMesh && o.name) mats[o.name] = {}; });
  return {
    _comment: 'Sidecar skeleton generated from the current model. "*" applies to every mesh without its own non-empty entry; named entries below are placeholders — add properties to override that mesh specifically.',
    materials: mats,
  };
}

function renderLint(res) {
  const lint = $('lint');
  if (res.msgs.length === 0) {
    lint.innerHTML = '<div class="ok">✓ Valid JSON, valid three.js material settings.</div>';
  } else {
    lint.innerHTML = res.msgs.map(m =>
      `<div class="${m.lvl}">${m.lvl === 'error' ? '✕' : '⚠'} ${m.msg.replace(/</g, '&lt;')}</div>`).join('') +
      (res.ok ? '<div class="ok">✓ No blocking errors — warnings only.</div>' : '');
  }
  $('applyBtn').disabled = !res.ok;
  return res;
}

function openEditor() {
  editorText.value = JSON.stringify(sidecarSpec ?? buildSkeleton(), null, 2);
  $('sidecarNameEl').textContent = sidecarName ? `· ${sidecarName}` : '· (new, from current model)';
  renderLint(lintSidecar(editorText.value));
  editor.classList.add('open');
}

$('sidecarBtn').onclick = () => editor.classList.contains('open') ? editor.classList.remove('open') : openEditor();
$('closeBtn').onclick = () => editor.classList.remove('open');
let lintTimer;
editorText.addEventListener('input', () => {
  clearTimeout(lintTimer);
  lintTimer = setTimeout(() => renderLint(lintSidecar(editorText.value)), 250);
});
$('applyBtn').onclick = () => {
  const res = renderLint(lintSidecar(editorText.value));
  if (!res.ok) return;
  sidecarSpec = res.spec;
  if (!sidecarName) sidecarName = '(edited in page)';
  $('sidecarNameEl').textContent = `· ${sidecarName}`;
  $('ovToggle').checked = true;
  prepareSidecar();
};
$('clearBtn').onclick = () => {
  sidecarSpec = null; sidecarName = '';
  prepareSidecar();
  editorText.value = JSON.stringify(buildSkeleton(), null, 2);
  $('sidecarNameEl').textContent = '· (new, from current model)';
  renderLint(lintSidecar(editorText.value));
};
$('docsBtn').onclick = () =>
  window.open('https://threejs.org/docs/#api/en/materials/MeshPhysicalMaterial', '_blank', 'noopener');

// --- custom component modules --------------------------------------------------
// A component is an ES module exporting `createComponent(ctx)` — the escape
// hatch for looks a sidecar can't express (custom shaders, animated layers).
// It may return an `object` (a THREE.Object3D shown in place of the model,
// under the pivot so spin works) or a `material` (applied to the loaded
// model's meshes), plus optional update(dt) / dispose() / framing hints.
// SECURITY: a component runs with full page privileges, like pasting code
// into the DevTools console. Components therefore load ONLY from this site's
// own origin (?component=relative/path.js) or from a file the user explicitly
// picks/drops. Cross-origin URLs are rejected.
let component = null;   // { name, api, kind: 'object' | 'material', root?, seq? }
                        // root: what sits under the pivot — api.object, or the
                        // wrapper Group a sequence animates; seq: the running
                        // sequence runtime (see the sequences section below)

// Components may take over pointer input (e.g. a pack icon's own drag/spin
// controller). While attached, OrbitControls stops rotating the camera (zoom
// stays) and pointer events go to the component instead.
let pointerListeners = null;
function attachPointer(p) {
  detachPointer();
  controls.enableRotate = false;
  const el = renderer.domElement;
  const down = e => { if (e.button !== undefined && e.button !== 0) return; p.down?.(e.clientX, e.clientY); el.setPointerCapture?.(e.pointerId); };
  const move = e => p.move?.(e.clientX, e.clientY);
  const up = () => p.up?.();
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointermove', move);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  pointerListeners = { down, move, up };
}
function detachPointer() {
  if (!pointerListeners) return;
  const el = renderer.domElement;
  el.removeEventListener('pointerdown', pointerListeners.down);
  el.removeEventListener('pointermove', pointerListeners.move);
  el.removeEventListener('pointerup', pointerListeners.up);
  el.removeEventListener('pointercancel', pointerListeners.up);
  pointerListeners = null;
  controls.enableRotate = true;
}

// While a SEQUENCE is live, one router owns the canvas instead of the active
// icon's own pointer handlers. It is the only place that can decide where a
// press landed, because only the sequence knows which icons are on screen —
// the big one AND the ones already sitting in rings. The router hit-tests on
// pointerdown and the runtime forwards the drag to that icon alone (AGENT.md
// §12.12). Camera ROTATION is off while it is attached; zoom is not, because
// pinch/wheel zoom is deliberately available in pack mode.
let dragListeners = null;
function attachIconDrag(router) {
  detachPointer();
  detachIconDrag();
  const el = renderer.domElement;
  let active = null;                    // the pointerId that owns the gesture
  const down = e => {
    if (e.button !== undefined && e.button !== 0) return;
    // A second finger means a pinch: give the gesture up rather than fight
    // OrbitControls for it.
    if (active !== null) { router.up(); active = null; return; }
    // 'grab' = an icon was hit; 'watch' = nothing was hit but the gesture is
    // still being classified, because a SWIPE is judged by its shape and not
    // by where it started (§12.13). Only a grab takes the pointer capture: a
    // watch must not swallow the gesture from OrbitControls under
    // `drag: camera`.
    const claim = router.down(toStageX(e.clientX), toStageY(e.clientY));
    if (!claim) return;
    active = e.pointerId;
    if (claim !== 'grab') return;
    // Synthetic pointers (a test harness) have no capture to take, and the
    // call throws rather than no-opping.
    try { el.setPointerCapture?.(e.pointerId); } catch { /* not a real pointer */ }
  };
  const move = e => { if (active === e.pointerId) router.move(toStageX(e.clientX), toStageY(e.clientY)); };
  const up = e => { if (active !== null && active === e.pointerId) { router.up(); active = null; } };
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointermove', move);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  dragListeners = { down, move, up };
}
function detachIconDrag() {
  if (!dragListeners) return;
  const el = renderer.domElement;
  el.removeEventListener('pointerdown', dragListeners.down);
  el.removeEventListener('pointermove', dragListeners.move);
  el.removeEventListener('pointerup', dragListeners.up);
  el.removeEventListener('pointercancel', dragListeners.up);
  dragListeners = null;
  applyInput(INPUT_OFF);   // back to the viewer's own defaults: orbit and zoom
}

function unloadComponent(reloadModel = false, keepBackground = false) {
  if (!component) return;
  stopSequence();
  try { component.api.dispose?.(); } catch (e) { console.warn('component dispose:', e); }
  if (component.kind === 'object' && component.root) pivot.remove(component.root);
  if (component.kind === 'material' && current) {
    current.traverse(o => { if (o.isMesh && originalMats.has(o)) o.material = originalMats.get(o); });
  }
  detachPointer();
  detachIconDrag();
  component = null;
  if (!keepBackground) { componentBg = null; applyBackground(); }
  $('compChip').style.display = 'none';
  refreshStatus();
  if (reloadModel) modelSelect.onchange();
}

async function applyComponentApi(api, name) {
  if (api?.object) {
    if (current) { pivot.remove(current); current = null; }   // component replaces the model
    // A sequence animates scale/rise on a WRAPPER around the icon, never on
    // the icon's own object — its controller may assign rotation every frame.
    const root = api.sequence ? new THREE.Group().add(api.object) : api.object;
    pivot.add(root);
    pivot.rotation.set(0, 0, 0);
    // `frozen` is the update switch: a sequence sets it while the icon it has
    // just landed must stop being animated by its own controller.
    component = { name, api, kind: 'object', root, seq: null, frozen: false };
    // Framing is solved here, at REST pose, and never again: the sequence's
    // t=0 pose (e.g. scale 0.52, fade 0) must not shrink the framed box, and a
    // flow that swaps icons must not re-frame under the visitor.
    frameComponent(api);
  } else if (api?.material) {
    if (!current) { status.textContent = `Component ${name} provides a material — load a model first.`; curtain.clear('loading'); return false; }
    current.traverse(o => { if (o.isMesh) o.material = api.material; });
    component = { name, api, kind: 'material' };
  } else {
    status.textContent = `Component ${name}: createComponent() must return { object }, { material }, or { icons }.`;
    curtain.clear('loading');
    return false;
  }
  componentBg = api.background ?? null;   // { image?, color? } — a component may bring its backdrop
  applyBackground();
  // The backdrop is PART of the first draw, not something that fades in behind
  // a lifted curtain. Nothing used to wait for it — it is a CSS
  // background-image — so on a slow link the curtain came up on a lit icon over
  // a bare ground and the picture completed seconds later. Measured on a
  // 250 KB/s link with a 687 KB backdrop: the curtain lifted at 5.3 s and the
  // background finished at 10.1 s, because it was sharing the link with 4.5 MB
  // of icons for steps nobody had reached.
  let bgWait = null;
  if (componentBg?.image) {
    // Normally already in flight from enterPack(); started here for a component
    // that is not a pack, or for an icon whose `backgrounds:` override differs.
    if (bgPreload?.url === componentBg.image) bgWait = bgPreload.promise;
    else { loadMon.expect(1); bgWait = awaitImage(componentBg.image, 'the pack background'); }
  }
  bgPreload = null;
  if (api.pointer) attachPointer(api.pointer);
  $('compName').textContent = name;
  $('compChip').style.display = 'inline-block';
  refreshStatus();
  if (api.sequence && component.kind === 'object') {
    await startSequence(component);
    // The curtain comes down as soon as STEP 1 CAN DRAW — its t=0 pose applied
    // — and NOT when the whole pack has finished loading. The remaining icons
    // and their glyph captures are acquired AFTER this, gated on `firstDraw`
    // (`seq.ready`), which is the difference between a first frame in a few
    // hundred milliseconds and one in several seconds.
    try { await component?.seq?.posed; } catch (e) { console.warn('sequence pose:', e); }
  }
  // Errors here are already named and shown by the monitor; swallowing the
  // rejection only stops it becoming an unhandled one.
  if (bgWait) { try { await bgWait; } catch (e) { console.warn('background:', e); } }
  loadMon.settle();
  curtain.clear('loading');
  markFirstDraw();
  return true;
}

// --- sequences (entrance choreography from a pack's sequence.yml) ---------------
// A loaded icon may carry `api.sequence = { file, doc }` — the pack loader's
// parsed sequence.yml (AGENT.md §12). The runtime in ./sequence.js compiles it
// into a paused Anime.js timeline that the render loop drives with seek(t)
// from accumulated dt, so it is deterministic and scrubbable. Both modules are
// imported only here, so a pack without a sequence never fetches them.
const fgEl = $('fg');
const seqWrap = $('seqWrap'), seqScrub = $('seqScrub'), seqPlay = $('seqPlay'), seqTime = $('seqTime');

// The viewer holds exactly ONE live icon for a plain entrance, but a multi-step
// flow keeps the icons it has already collected on screen while the next one
// arrives. Those landed icons are reparented into `landedGroup` and dropped
// from the update path — an icon that is still being updated cannot be frozen,
// because its own controller reassigns rotation.y every frame (measured).
// Everything three.js the sequence needs lives here; sequence.js owns time,
// DOM and state and never imports three.
// 512, not 256. A ring's glyph box is around 90 CSS px on a phone, which at
// the DPR 3 those phones report is ~270 device pixels — a 256 px PNG was being
// upscaled there, and read soft and pale next to the 3D object it replaces. The
// cost is one 1 MB data URL per icon (a few MB for a whole pack), paid once at
// preload and again once per landing, which is nothing against a pack's models.
const GLYPH_PX = 512;
// The fraction of a ring's INNER box the glyph <img> occupies — it must match
// the `#fg .fg-slot .fg-glyph` width in the CSS above, because the glyph is
// captured through exactly that box so the PNG and the live object are the
// same silhouette at ring size.
//
// WHY .60 AND NOT MORE. A square box's corners sit at half-width * sqrt(2). At
// .76 that put them past the ring's inner edge and INSIDE the stroke, where
// iOS Safari painted them as black notches at the four diagonals. Measured on
// a real iPhone: a 55px ring with a 3.7px stroke has its band from r=23.8 to
// r=27.5, and a .76 box (36px) has corners at 25.5 — squarely in it. At .60
// (33px) the corners reach 23.3, inside the band, so the overhang cannot exist
// no matter what the compositor does.
//
// This costs NO apparent size. GLYPH_BOX crops the CAPTURE and sizes the
// ELEMENT by the same fraction, while the object's own scale comes from a
// landing's `fit:`. A tighter box is a tighter crop shown in a smaller element:
// the mark is identical on screen, with less empty margin around it. The art
// still fits with room — its opaque content reaches ~.81 of half-width, which
// is 14.6px against the 16.5px this box allows.
const GLYPH_BOX = 0.60;
let glyphTarget = null;

function makeSequenceHost(comp) {
  const first = { name: comp.name, api: comp.api, wrapper: comp.root, frozen: false };
  const handles = new Map([[first.name, first]]);
  const landedGroup = new THREE.Group();
  landedGroup.name = 'sequence-landed';
  pivot.add(landedGroup);

  function setActive(h) {
    // `component.api` IS the active icon: the render loop, the status line and
    // unload all read it, so a flow swaps it rather than shadowing it. The
    // NAME goes with it — without that the status line kept announcing the
    // icon the page loaded while a completely different one was on screen.
    if (!component) return;
    if (!h) { component.frozen = true; return; }
    component.api = h.api;
    component.root = h.wrapper;
    component.name = h.name;
    component.frozen = false;
    $('compName').textContent = h.name;
    // The dropdown names the icon on screen too. Assigning `value` does not
    // fire `change`, so this labels the swap without re-loading the icon.
    if (zipState) {
      const val = 'zipicon:' + h.name;
      if (modelSelect.value !== val && [...modelSelect.options].some(o => o.value === val)) modelSelect.value = val;
    }
    refreshStatus();
    // Pointer input is NOT attached per icon here. While a sequence is live
    // one hit-testing router owns the canvas (attachIconDrag above) and
    // forwards each drag to whichever icon it actually landed on.
  }

  function setFrozen(h, on) {
    if (!!h.frozen === !!on) return;
    h.frozen = !!on;
    // attach() preserves the world transform; both parents are identity, so
    // this is a bookkeeping move, not a visual one.
    (on ? landedGroup : pivot).attach(h.wrapper);
    // An icon's visible radius is measured from its meshes AND its own current
    // scale (an icon may breathe), so re-measure at the instant it stops being
    // updated: that is the size it is going to keep.
    radii.delete(h);
    // NOTHING is written to rotation here any more. The landing tweens the
    // icon to its rest orientation across the whole flight (§12.6), so it
    // arrives already facing front; the assignment that used to live here was
    // a single-frame snap of up to 180 degrees.
  }

  function rest(h) {
    setFrozen(h, false);
    h.wrapper.position.set(0, 0, 0);
    h.wrapper.scale.setScalar(1);
    h.wrapper.rotation.set(0, 0, 0);   // the drag offset the runtime parks here
    radii.delete(h);
  }

  // --- measuring the 2D destinations ---------------------------------------------
  // A ring is a DOM element fixed to the VIEWPORT; a landed icon is in the 3D
  // world. Anything that changes the projection — a wheel or pinch zoom, a
  // window resize, a phone rotating — moves one and not the other, so the
  // world position is re-solved from the ring's CURRENT rect every frame
  // rather than measured once at landing (which drifted the object clean out
  // of its ring on the first zoom: measured [0, -67] px).
  //
  // Cost control: one getBoundingClientRect per element per FRAME (cleared by
  // beginFrame, so repeated reads inside a frame are free), and the expensive
  // getComputedStyle border read only when the rect's size actually changes.
