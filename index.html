<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GLB Turntable Viewer (three.js)</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 120%, #1c1c22 0%, #101014 55%, #08080a 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #cfd6ea;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 10px 12px;
    background: linear-gradient(#04060fcc, transparent);
    pointer-events: none;
  }
  #hud > * { pointer-events: auto; }
  select, button, label.file {
    background: #141b33; color: #cfd6ea;
    border: 1px solid #2a3560; border-radius: 8px;
    padding: 6px 10px; font-size: 13px; cursor: pointer;
  }
  select:hover, button:hover, label.file:hover { border-color: #4257a0; }
  input[type="file"] { display: none; }
  input[type="range"] { accent-color: #5d79e6; width: 110px; }
  input[type="checkbox"] { accent-color: #5d79e6; }
  .grp { display: flex; align-items: center; gap: 6px; font-size: 12px; opacity: .9; }

  #status {
    position: fixed; bottom: 10px; left: 12px; right: 12px;
    font-size: 12px; opacity: .75; text-align: center;
    text-shadow: 0 1px 3px #000;
  }
  #drop {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: #04060fd0; border: 3px dashed #4257a0;
    font-size: 20px; z-index: 10;
  }

  /* --- sidecar editor panel --- */
  #editor {
    position: fixed; top: 54px; right: 10px; bottom: 42px;
    width: min(440px, calc(100vw - 20px));
    display: none; flex-direction: column; gap: 8px;
    background: #0d1120f2; border: 1px solid #2a3560; border-radius: 10px;
    padding: 10px; z-index: 5;
  }
  #editor.open { display: flex; }
  #editorHead { font-size: 13px; font-weight: 600; }
  #editorHead .name { font-weight: 400; opacity: .7; }
  #editorText {
    flex: 1; resize: none; background: #0a0d18; color: #d8def0;
    border: 1px solid #232c4e; border-radius: 8px; padding: 8px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px;
    line-height: 1.45; tab-size: 2; white-space: pre; overflow: auto;
  }
  #lint { max-height: 30%; overflow: auto; font-size: 12px; line-height: 1.5; }
  #lint .error { color: #ff7a90; }
  #lint .warn { color: #ffc978; }
  #lint .ok { color: #7ce0a3; }
  #editorBtns { display: flex; gap: 8px; }
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <select id="modelSelect" title="Pick a bundled model">
    <option value="models/DragonAttenuation.glb">Glass dragon (transmission)</option>
    <option value="models/DragonAttenuation.glb" data-sidecar="sidecars/example-emerald-glass.json">Glass dragon + example sidecar (emerald)</option>
    <option value="models/MosquitoInAmber.glb">Mosquito in amber (deep glass volume)</option>
    <option value="models/GlassVaseFlowers.glb">Glass vase with flowers</option>
    <option value="models/GlassHurricaneCandleHolder.glb">Glass hurricane candle holder</option>
    <option value="models/IridescentDishWithOlives.glb">Iridescent glass dish</option>
    <option value="models/DispersionTest.glb">Dispersion test (prism glass)</option>
    <option value="models/DamagedHelmet.glb">Damaged helmet (PBR classic)</option>
  </select>
  <label class="file">Load .glb / .json…<input type="file" id="filePick" accept=".glb,.gltf,.json" multiple></label>
  <span class="grp">Pivot
    <select id="pivotSelect" title="Vertical axis the model spins around">
      <option value="center">Center (bounding box)</option>
      <option value="origin">As exported (model origin)</option>
    </select>
  </span>
  <span class="grp">Spin <input type="range" id="speed" min="0" max="3" step="0.05" value="0.3"></span>
  <button id="pauseBtn" title="Pause / resume spin">Pause</button>
  <label class="grp" id="ovWrap" style="display:none" title="Toggle the loaded sidecar's material settings">
    <input type="checkbox" id="ovToggle" checked> Apply sidecar settings
  </label>
  <button id="sidecarBtn" title="View / edit the sidecar JSON">Sidecar…</button>
</div>

<div id="editor">
  <div id="editorHead">Sidecar settings (JSON) <span class="name" id="sidecarNameEl"></span></div>
  <textarea id="editorText" spellcheck="false"></textarea>
  <div id="lint"></div>
  <div id="editorBtns">
    <button id="applyBtn">Apply</button>
    <button id="clearBtn" title="Remove the sidecar entirely">Clear sidecar</button>
    <button id="closeBtn">Close</button>
    <button id="docsBtn" title="MeshPhysicalMaterial property reference (opens a new window)">three.js docs ↗</button>
  </div>
</div>

<div id="status">Loading…</div>
<div id="drop">Drop .glb and/or sidecar .json anywhere</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/loaders/GLTFLoader.js';
import { OrbitControls } from './vendor/controls/OrbitControls.js';
import { RoomEnvironment } from './vendor/environments/RoomEnvironment.js';

const app = document.getElementById('app');
const status = document.getElementById('status');
const $ = id => document.getElementById(id);

// --- renderer / scene / camera -------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // needed for glass to look right
renderer.toneMappingExposure = 1.0;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// Image-based lighting so PBR + transmission materials read correctly,
// without shipping an HDRI file: RoomEnvironment is generated procedurally.
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 100);
camera.position.set(0, 0.6, 3);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;

// A subtle key light on top of the IBL, for a little sparkle.
const key = new THREE.DirectionalLight(0xffffff, 1.2);
key.position.set(3, 5, 4);
scene.add(key);

// Simple procedural starfield backdrop: generated in code (random points),
// plain white/gray stars on a neutral charcoal sky. Not derived from any asset.
{
  const N = 700, pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = 22 + Math.random() * 18;
    const t = Math.random() * Math.PI * 2, p = Math.acos(2 * Math.random() - 1);
    pos.set([r * Math.sin(p) * Math.cos(t), r * Math.cos(p), r * Math.sin(p) * Math.sin(t)], i * 3);
    const v = 0.55 + Math.random() * 0.45;   // white to soft gray, no color
    col.set([v, v, v], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const stars = new THREE.Points(g, new THREE.PointsMaterial({
    size: 0.09, vertexColors: true, sizeAttenuation: true, transparent: true, opacity: 0.85,
  }));
  scene.add(stars);
}

// --- model + pivot ----------------------------------------------------------
// The model is parented under a pivot group at the world origin. The spin is
// applied to the pivot, so wherever we position the model inside it defines
// the rotation axis. "Center" mode puts the vertical axis exactly through the
// middle of the visible bounding box; "origin" keeps the axis where the file's
// author put the model origin. ?pivot=x,y,z (model units) overrides both.
const pivot = new THREE.Group();
scene.add(pivot);

const loader = new GLTFLoader();
let current = null;      // THREE.Group holding the loaded model
let mixer = null;        // plays animations embedded in the GLB, if any
let baseLabel = '';

const params = new URLSearchParams(location.search);
const pivotParam = (params.get('pivot') || '').split(',').map(Number);
const manualPivot = pivotParam.length === 3 && pivotParam.every(Number.isFinite)
  ? new THREE.Vector3(...pivotParam) : null;

function chainVisible(o, root) {
  for (let p = o; p; p = p.parent) { if (!p.visible) return false; if (p === root) break; }
  return true;
}

function visibleBox(obj) {
  const box = new THREE.Box3();
  obj.updateWorldMatrix(true, true);
  obj.traverse(o => {
    if (o.isMesh && chainVisible(o, obj)) box.union(new THREE.Box3().setFromObject(o));
  });
  if (box.isEmpty()) box.setFromObject(obj);
  return box;
}

function applyPivot() {
  if (!current) return;
  // Measure with the spin zeroed: a rotated pivot would skew the bounding box
  // and produce a wrong offset.
  const rotY = pivot.rotation.y;
  pivot.rotation.set(0, 0, 0);
  current.position.set(0, 0, 0);
  const box = visibleBox(current);
  const center = box.getCenter(new THREE.Vector3());
  if (manualPivot) {
    current.position.copy(manualPivot).negate();
  } else if ($('pivotSelect').value === 'center') {
    current.position.copy(center).negate();   // spin axis through bbox center
  } // 'origin': leave at 0,0,0 — spin around the authored origin
  frameCamera();                               // frame while still unrotated
  pivot.rotation.y = rotY;                     // resume the spin where it was
}

function frameCamera() {
  const box = visibleBox(pivot);
  const size = box.getSize(new THREE.Vector3()).length();
  const center = box.getCenter(new THREE.Vector3());
  const dist = size * 1.95;  // start small: model ~35% of viewport height
  camera.position.set(center.x, center.y + size * 0.15, center.z + dist);
  camera.near = size / 100; camera.far = size * 20;
  camera.updateProjectionMatrix();
  controls.target.copy(center);
  controls.update();
}

// --- sidecar material settings ----------------------------------------------
// Effects that don't survive a glTF export (e.g. glass/transmission looks) are
// described in a sidecar JSON. The sidecar is EXPLICIT: pass it with
// ?sidecar=path/to/file.json, pick it in the file dialog (multi-select with
// the model), or drag-drop it — any filename works, and one sidecar can serve
// several models. It stays loaded across model switches until cleared.
// Schema: { "materials": { "<mesh name>" | "*": { MeshPhysicalMaterial props,
// colors as hex strings } } }. Keys starting with "_" are comments.
let sidecarSpec = null;
let sidecarName = '';
const originalMats = new Map();   // mesh -> material as exported
const overrideMats = new Map();   // mesh -> sidecar-built material

const COLOR_PROPS = new Set(['color', 'attenuationColor', 'emissive', 'sheenColor', 'specularColor']);
function buildMaterial(spec) {
  const m = new THREE.MeshPhysicalMaterial();
  for (const [k, v] of Object.entries(spec)) {
    if (k.startsWith('_')) continue;
    if (COLOR_PROPS.has(k)) m[k] = new THREE.Color(v);
    else if (k in m) m[k] = v;
  }
  return m;
}

function prepareSidecar() {
  overrideMats.clear();
  if (sidecarSpec?.materials && current) {
    current.traverse(o => {
      if (!o.isMesh) return;
      const spec = sidecarSpec.materials[o.name] ?? sidecarSpec.materials['*'];
      if (spec) overrideMats.set(o, buildMaterial(spec));
    });
  }
  $('ovWrap').style.display = overrideMats.size ? 'flex' : 'none';
  applySidecar(overrideMats.size ? $('ovToggle').checked : false);
}

function applySidecar(on) {
  if (current) current.traverse(o => {
    if (!o.isMesh) return;
    o.material = (on && overrideMats.get(o)) || originalMats.get(o) || o.material;
  });
  refreshStatus();
}

function setSidecar(spec, name) {
  sidecarSpec = spec;
  sidecarName = name;
  prepareSidecar();
  if (editor.classList.contains('open')) openEditor();   // refresh editor view
}

async function loadSidecarURL(url) {
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const res = lintSidecar(await r.text());
    setSidecar(res.spec ?? null, url.split('/').pop());
    if (!res.ok) status.textContent = `Sidecar ${url} has errors — open Sidecar… to review.`;
  } catch (err) { status.textContent = `Could not load sidecar ${url}: ${err.message}`; }
}

// --- sidecar linter -----------------------------------------------------------
// Two layers: valid JSON, then valid-for-three.js (known MeshPhysicalMaterial
// properties, right value types, mesh names that exist in the current model).
const PROP_TYPES = {
  color:'color', metalness:'unit', roughness:'unit', transmission:'unit',
  thickness:'number', ior:'number', attenuationColor:'color',
  attenuationDistance:'number', clearcoat:'unit', clearcoatRoughness:'unit',
  emissive:'color', emissiveIntensity:'number', iridescence:'unit',
  iridescenceIOR:'number', sheen:'unit', sheenColor:'color',
  sheenRoughness:'unit', specularColor:'color', specularIntensity:'unit',
  opacity:'unit', transparent:'boolean', envMapIntensity:'number',
  flatShading:'boolean', wireframe:'boolean', reflectivity:'unit',
  dispersion:'number', anisotropy:'number', anisotropyRotation:'number',
};

function lintSidecar(text) {
  let spec;
  try { spec = JSON.parse(text); }
  catch (e) { return { ok: false, msgs: [{ lvl: 'error', msg: 'Invalid JSON: ' + e.message }] }; }
  const msgs = [];
  if (typeof spec !== 'object' || spec === null || Array.isArray(spec))
    return { ok: false, msgs: [{ lvl: 'error', msg: 'Root must be a JSON object.' }] };
  for (const k of Object.keys(spec))
    if (k !== 'materials' && !k.startsWith('_'))
      msgs.push({ lvl: 'warn', msg: `Unknown root key "${k}" (only "materials" is used; "_..." keys are comments).` });
  if (!spec.materials || typeof spec.materials !== 'object' || Array.isArray(spec.materials)) {
    msgs.push({ lvl: 'error', msg: 'Missing "materials" object at the root.' });
    return { ok: false, msgs, spec };
  }
  const meshNames = new Set();
  current?.traverse(o => { if (o.isMesh && o.name) meshNames.add(o.name); });
  for (const [target, props] of Object.entries(spec.materials)) {
    if (target.startsWith('_')) continue;
    if (typeof props !== 'object' || props === null || Array.isArray(props)) {
      msgs.push({ lvl: 'error', msg: `"${target}" must map to an object of material properties.` });
      continue;
    }
    if (target !== '*' && meshNames.size && !meshNames.has(target))
      msgs.push({ lvl: 'warn', msg: `"${target}" doesn't match any mesh in the current model (meshes: ${[...meshNames].join(', ')}).` });
    for (const [k, v] of Object.entries(props)) {
      if (k.startsWith('_')) continue;
      const t = PROP_TYPES[k];
      if (!t) { msgs.push({ lvl: 'warn', msg: `"${k}" is not a known MeshPhysicalMaterial property (threejs.org/docs → MeshPhysicalMaterial).` }); continue; }
      if (t === 'color' && !(typeof v === 'number' || (typeof v === 'string' && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v))))
        msgs.push({ lvl: 'error', msg: `"${k}" must be a hex color string like "#cfc6e8" (got ${JSON.stringify(v)}).` });
      else if ((t === 'number' || t === 'unit') && typeof v !== 'number')
        msgs.push({ lvl: 'error', msg: `"${k}" must be a number (got ${JSON.stringify(v)}).` });
      else if (t === 'unit' && typeof v === 'number' && (v < 0 || v > 1))
        msgs.push({ lvl: 'warn', msg: `"${k}" is usually between 0 and 1 (got ${v}).` });
      else if (t === 'boolean' && typeof v !== 'boolean')
        msgs.push({ lvl: 'error', msg: `"${k}" must be true or false (got ${JSON.stringify(v)}).` });
    }
  }
  return { ok: !msgs.some(m => m.lvl === 'error'), msgs, spec };
}

// --- sidecar editor UI ---------------------------------------------------------
const editor = $('editor');
const editorText = $('editorText');
const EDITOR_TEMPLATE = `{
  "_comment": "Sidecar material settings. \\"*\\" applies to every mesh; use a mesh name for per-part materials.",
  "materials": {
    "*": {
      "color": "#cfc6e8",
      "metalness": 0,
      "roughness": 0.1,
      "transmission": 0.9,
      "ior": 1.45
    }
  }
}`;

function renderLint(res) {
  const lint = $('lint');
  if (res.msgs.length === 0) {
    lint.innerHTML = '<div class="ok">✓ Valid JSON, valid three.js material settings.</div>';
  } else {
    lint.innerHTML = res.msgs.map(m =>
      `<div class="${m.lvl}">${m.lvl === 'error' ? '✕' : '⚠'} ${m.msg.replace(/</g, '&lt;')}</div>`).join('') +
      (res.ok ? '<div class="ok">✓ No blocking errors — warnings only.</div>' : '');
  }
  $('applyBtn').disabled = !res.ok;
  return res;
}

function openEditor() {
  editorText.value = sidecarSpec ? JSON.stringify(sidecarSpec, null, 2) : EDITOR_TEMPLATE;
  $('sidecarNameEl').textContent = sidecarName ? `· ${sidecarName}` : '· (new)';
  renderLint(lintSidecar(editorText.value));
  editor.classList.add('open');
}

$('sidecarBtn').onclick = () => editor.classList.contains('open') ? editor.classList.remove('open') : openEditor();
$('closeBtn').onclick = () => editor.classList.remove('open');
let lintTimer;
editorText.addEventListener('input', () => {
  clearTimeout(lintTimer);
  lintTimer = setTimeout(() => renderLint(lintSidecar(editorText.value)), 250);
});
$('applyBtn').onclick = () => {
  const res = renderLint(lintSidecar(editorText.value));
  if (!res.ok) return;
  sidecarSpec = res.spec;
  if (!sidecarName) sidecarName = '(edited in page)';
  $('sidecarNameEl').textContent = `· ${sidecarName}`;
  $('ovToggle').checked = true;
  prepareSidecar();
};
$('clearBtn').onclick = () => {
  sidecarSpec = null; sidecarName = '';
  prepareSidecar();
  editorText.value = EDITOR_TEMPLATE;
  $('sidecarNameEl').textContent = '· (new)';
  renderLint(lintSidecar(editorText.value));
};
$('docsBtn').onclick = () =>
  window.open('https://threejs.org/docs/#api/en/materials/MeshPhysicalMaterial', '_blank', 'noopener');

// --- model loading -----------------------------------------------------------
function refreshStatus() {
  const anims = mixer ? mixer._actions.length : 0;
  const sc = overrideMats.size
    ? ($('ovToggle').checked ? ` • sidecar ${sidecarName} ON` : ` • sidecar ${sidecarName} off (as exported)`)
    : (sidecarSpec ? ` • sidecar ${sidecarName} matches no meshes` : '');
  status.textContent = `${baseLabel} • drag to orbit, wheel/pinch to zoom` +
    (anims ? ` • ${anims} embedded animation${anims > 1 ? 's' : ''} playing` : ' • no embedded animations (spin is ours)') + sc;
}

function setModel(gltf, label) {
  if (current) { pivot.remove(current); current.traverse(o => { o.geometry?.dispose?.(); }); }
  mixer = null;
  originalMats.clear();
  current = gltf.scene;
  // Hide backdrop/stage meshes some sample models ship with — we only want the hero.
  current.traverse(o => { if (/backdrop|stage|floor|ground/i.test(o.name)) o.visible = false; });
  current.traverse(o => { if (o.isMesh) originalMats.set(o, o.material); });
  pivot.add(current);
  pivot.rotation.set(0, 0, 0);
  applyPivot();
  if (gltf.animations?.length) {
    mixer = new THREE.AnimationMixer(current);
    gltf.animations.forEach(clip => mixer.clipAction(clip).play());
  }
  baseLabel = label;
  prepareSidecar();   // re-match the (sticky) sidecar against the new meshes
  refreshStatus();
}

function loadURL(url, label) {
  status.textContent = `Loading ${label}…`;
  loader.load(url, g => setModel(g, label),
    xhr => { if (xhr.total) status.textContent = `Loading ${label}… ${Math.round(xhr.loaded / xhr.total * 100)}%`; },
    err => { status.textContent = `Failed to load ${label}: ${err.message ?? err}`; console.error(err); });
}

// --- UI ----------------------------------------------------------------------
const speedInput = $('speed');
const pauseBtn = $('pauseBtn');
let paused = false;
pauseBtn.onclick = () => { paused = !paused; pauseBtn.textContent = paused ? 'Resume' : 'Pause'; };

const modelSelect = $('modelSelect');
modelSelect.onchange = () => {
  const opt = modelSelect.selectedOptions[0];
  if (opt.dataset.sidecar) loadSidecarURL(opt.dataset.sidecar);
  loadURL(opt.value, opt.textContent);
};

$('pivotSelect').onchange = () => applyPivot();
$('ovToggle').onchange = e => applySidecar(e.target.checked);

// Custom loads (URL param, file picker, drag-drop) get their own dropdown
// entry showing the file name and where it came from, so the selector always
// reflects what is actually on screen.
function selectCustom(name, sourceTag, value) {
  let opt = document.getElementById('customOpt');
  if (!opt) {
    opt = document.createElement('option');
    opt.id = 'customOpt';
    modelSelect.appendChild(opt);
  }
  opt.value = value;
  opt.textContent = `${name} (${sourceTag})`;
  modelSelect.value = value;
}

// Accepts any mix of one model file and one sidecar .json, in one gesture.
async function handleFiles(files) {
  const list = [...files];
  const json = list.find(f => f.name.toLowerCase().endsWith('.json'));
  const model = list.find(f => /\.(glb|gltf)$/i.test(f.name));
  if (json) {
    try {
      const res = lintSidecar(await json.text());
      if (!res.ok) { status.textContent = `Sidecar ${json.name} has errors — open Sidecar… to fix.`; }
      setSidecar(res.spec ?? null, json.name);
      if (res.spec && !editor.classList.contains('open') && !res.ok) { openEditor(); editorText.value = await json.text(); renderLint(res); }
    } catch (err) { status.textContent = `Could not read ${json.name}: ${err.message}`; }
  }
  if (model) {
    const url = URL.createObjectURL(model);
    selectCustom(model.name, 'file', url);
    loadURL(url, model.name);
  } else if (json) {
    prepareSidecar();   // sidecar-only: apply to whatever is on screen
  }
}
$('filePick').onchange = e => { if (e.target.files.length) handleFiles(e.target.files); };

// Drag & drop .glb and/or sidecar .json from Finder (together or separately).
const drop = $('drop');
addEventListener('dragover', e => { e.preventDefault(); drop.style.display = 'flex'; });
drop.addEventListener('dragleave', () => drop.style.display = 'none');
addEventListener('drop', e => {
  e.preventDefault(); drop.style.display = 'none';
  if (e.dataTransfer.files?.length) handleFiles(e.dataTransfer.files);
});

// ?model=path.glb picks the model; ?sidecar=path.json loads material settings.
// The sidecar is never assumed from the model name — it must be passed.
(async () => {
  const sc = params.get('sidecar');
  if (sc) await loadSidecarURL(sc);
  const qs = params.get('model');
  if (qs) {
    selectCustom(qs.split('/').pop(), 'URL', qs);
    loadURL(qs, qs.split('/').pop());
  } else {
    loadURL(modelSelect.value, modelSelect.selectedOptions[0].textContent);
  }
})();

// --- render loop ---------------------------------------------------------------
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (current && !paused) pivot.rotation.y += dt * parseFloat(speedInput.value);
  mixer?.update(dt);
  controls.update();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Debug handle for console experiments (material tweaks, inspection).
