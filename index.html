<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GLB Turntable Viewer (three.js)</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 120%, #1c1c22 0%, #101014 55%, #08080a 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #cfd6ea;
  }
  /* Backdrop is a 2D layer behind the transparent canvas (never scene geometry),
     so camera moves can't shift it — the same layering a real page uses. */
  #bg { position: fixed; inset: 0; background: center / cover no-repeat; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  /* Foreground overlay: 2D copy and calls-to-action a pack's sequence.yml draws
     ABOVE the canvas (real DOM text — selectable, accessible — never canvas).
     Click-through by default so the icon can still be dragged; only elements a
     sequence binds an action to take pointer events. Emptied on unload. */
  #fg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  #fg .fg-el {
    position: absolute; transform: translate(-50%, -50%);
    /* max-content: an absolutely-positioned box at left:50% would otherwise
       shrink-wrap to the remaining half of the viewport and wrap early. */
    width: max-content; max-width: 92vw;
    text-align: center; white-space: pre-wrap; line-height: 1.15;
    color: #f2f5ff; --glow: #f2f5ff;
    text-shadow: 0 2px 12px #0008;
    will-change: transform, opacity, filter, clip-path;
  }
  #fg .fg-button {
    background: none; border: 0; padding: .1em .4em; font: inherit; color: inherit;
    cursor: default; border-radius: .3em;
  }
  #fg .fg-action { pointer-events: auto; cursor: pointer; }
  #fg .fg-action:hover { text-decoration: underline; text-underline-offset: .15em; }
  /* Slots: a row of rings a sequence collects icons into. Three states —
     pending (dim, empty), next (bright, empty: the ring the current icon will
     land in) and filled (bright, holding that icon's 2D glyph). Every colour
     and size is a custom property the sequence sets from the YAML; the values
     here are only the defaults. */
  #fg .fg-slots { display: flex; gap: .5em; --slot-on: #e9e3f4; --slot-off: #e9e3f444; --slot-ring: .07em; }
  #fg .fg-slot {
    width: 1em; height: 1em; border-radius: 50%; box-sizing: border-box;
    border: var(--slot-ring) solid var(--slot-off); background: transparent;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    transition: border-color .25s ease, box-shadow .25s ease;
  }
  #fg .fg-slot.is-next   { border-color: var(--slot-on); box-shadow: 0 0 .5em color-mix(in srgb, var(--slot-on) 55%, transparent); }
  #fg .fg-slot.is-filled { border-color: var(--slot-on); }
  /* 76% is not decorative: the glyph is CAPTURED through the same box (see
     GLYPH_BOX in the sequence host) so the PNG and the live 3D object are the
     same size and the same projection at ring size. Change one, change both. */
  #fg .fg-slot .fg-glyph { width: 76%; height: 76%; object-fit: contain; display: block; }
  /* An author rule beats the UA's [hidden] rule, so say it here too — without
     this an emptied ring shows a broken-image icon instead of nothing. */
  #fg .fg-slot .fg-glyph[hidden] { display: none; }
  /* DEPRECATED: `pips` is the Phase 1 progress row, superseded by `slots`. */
  #fg .fg-pips { display: flex; gap: .9em; }
  #fg .fg-pip {
    width: 1em; height: 1em; border-radius: 50%;
    border: .12em solid #e9e3f4cc; background: transparent; box-sizing: border-box;
  }
  #fg .fg-pip.on { background: #e9e3f4; box-shadow: 0 0 .6em #e9e3f499; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 10px 12px;
    background: linear-gradient(#04060fcc, transparent);
    pointer-events: none;
  }
  #hud > * { pointer-events: auto; }
  select, button, label.file {
    background: #141b33; color: #cfd6ea;
    border: 1px solid #2a3560; border-radius: 8px;
    padding: 6px 10px; font-size: 13px; cursor: pointer;
  }
  select:hover, button:hover, label.file:hover { border-color: #4257a0; }
  input[type="file"] { display: none; }
  input[type="range"] { accent-color: #5d79e6; width: 110px; }
  input[type="checkbox"] { accent-color: #5d79e6; }
  .grp { display: flex; align-items: center; gap: 6px; font-size: 12px; opacity: .9; }

  #status {
    position: fixed; bottom: 10px; left: 12px; right: 12px;
    font-size: 12px; opacity: .75; text-align: center;
    text-shadow: 0 1px 3px #000;
  }
  #drop {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: #04060fd0; border: 3px dashed #4257a0;
    font-size: 20px; z-index: 10;
  }

  /* --- sidecar editor panel --- */
  #editor {
    position: fixed; top: 54px; right: 10px; bottom: 42px;
    width: min(440px, calc(100vw - 20px));
    display: none; flex-direction: column; gap: 8px;
    background: #0d1120f2; border: 1px solid #2a3560; border-radius: 10px;
    padding: 10px; z-index: 5;
  }
  #editor.open { display: flex; }
  #editorHead { font-size: 13px; font-weight: 600; }
  #editorHead .name { font-weight: 400; opacity: .7; }
  #editorText {
    flex: 1; resize: none; background: #0a0d18; color: #d8def0;
    border: 1px solid #232c4e; border-radius: 8px; padding: 8px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px;
    line-height: 1.45; tab-size: 2; white-space: pre; overflow: auto;
  }
  #lint { max-height: 30%; overflow: auto; font-size: 12px; line-height: 1.5; }
  #lint .error { color: #ff7a90; }
  #lint .warn { color: #ffc978; }
  #lint .ok { color: #7ce0a3; }
  #editorBtns { display: flex; gap: 8px; flex-wrap: wrap; }

  #links { margin-left: auto; display: flex; gap: 12px; }
  #links a {
    display: inline-flex; align-items: center; gap: 5px;
    color: #8fa1d8; font-size: 12px; text-decoration: none; opacity: .85;
  }
  #links a:hover { opacity: 1; text-decoration: underline; }

  /* Zip (icon pack) mode: the pack owns motion, materials, and framing, so
     the turntable and sidecar controls are hidden — the dropdown carries the
     pack's icons plus its own unload entry. */
  body.zipmode #pivotWrap, body.zipmode #spinWrap, body.zipmode #pauseBtn,
  body.zipmode #sidecarBtn, body.zipmode #ovWrap, body.zipmode #compChip,
  body.zipmode #starsWrap, body.zipmode #bgChip {
    display: none !important;
  }
  /* Sequence transport: shown only while a loaded icon has a sequence. */
  #seqWrap { display: none; }
  #seqWrap button { min-width: 2.4em; padding: 4px 6px; }
  #seqTime { font-variant-numeric: tabular-nums; min-width: 4.5em; }

  /* --- narrow screens (phones): compact HUD + bottom-sheet editor ---------- */
  @media (max-width: 640px) {
    #hud { gap: 8px; padding: 8px; }
    /* Model picker gets its own full-width row; the rest wrap beneath it. */
    #modelSelect { flex: 1 1 100%; }
    /* 16px inputs prevent iOS Safari's auto-zoom on focus; 40px+ = touchable. */
    select, button, label.file { min-height: 40px; font-size: 16px; }
    input[type="range"] { width: 80px; }

    /* Editor becomes a bottom sheet: plays well with the on-screen keyboard
       and leaves the model visible above. dvh tracks the browser's dynamic
       toolbar; safe-area padding keeps buttons off the home indicator. */
    #editor {
      top: auto; left: 0; right: 0; bottom: 0;
      width: auto; height: 70dvh;
      border-radius: 14px 14px 0 0; border-bottom: none;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
    }
    #editorText { font-size: 16px; }
    #editorBtns button { flex: 1; min-height: 44px; }
    #status { bottom: calc(6px + env(safe-area-inset-bottom)); font-size: 11px; }
  }
/* --- bare mode (?ui=0) ------------------------------------------------------
   Hides every viewer control so the page shows only what a pack draws: the
   background layer, the canvas and the sequence overlay. The elements stay in
   the DOM and keep their values, so nothing that reads #speed, #modelSelect or
   the sequence transport has to care. Drag, zoom and taps still work. */
body.bare #hud,
body.bare #status,
body.bare #drop,
body.bare #editor { display: none !important; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="app"></div>
<div id="fg"></div>

<div id="hud">
  <!-- A row's value is its identity, not its path: the same dragon appears
       twice (with and without a sidecar), and select.value must round-trip to
       the row the user picked. The file to load is data-model. -->
  <select id="modelSelect" title="Pick a bundled model">
    <option value="dragon" data-model="models/DragonAttenuation.glb">Glass dragon (transmission)</option>
    <option value="dragon-emerald" data-model="models/DragonAttenuation.glb" data-sidecar="sidecars/example-emerald-glass.json">Glass dragon + example sidecar (emerald)</option>
    <option value="mosquito" data-model="models/MosquitoInAmber.glb">Mosquito in amber (deep glass volume)</option>
    <option value="vase" data-model="models/GlassVaseFlowers.glb">Glass vase with flowers</option>
    <option value="hurricane" data-model="models/GlassHurricaneCandleHolder.glb">Glass hurricane candle holder</option>
    <option value="dish" data-model="models/IridescentDishWithOlives.glb">Iridescent glass dish</option>
    <option value="dispersion" data-model="models/DispersionTest.glb">Dispersion test (prism glass)</option>
    <option value="helmet" data-model="models/DamagedHelmet.glb">Damaged helmet (PBR classic)</option>
  </select>
  <label class="file">Load .glb / .json / .js / .zip / image…<input type="file" id="filePick" accept=".glb,.gltf,.json,.js,.zip,.png,.jpg,.jpeg,.webp" multiple></label>
  <span class="grp" id="pivotWrap">Pivot
    <select id="pivotSelect" title="Vertical axis the model spins around">
      <option value="center">Center (bounding box)</option>
      <option value="origin">As exported (model origin)</option>
    </select>
  </span>
  <span class="grp" id="spinWrap">Spin <input type="range" id="speed" min="0" max="3" step="0.05" value="0.3"></span>
  <button id="pauseBtn" title="Pause / resume spin">Pause</button>
  <button id="sidecarBtn" title="View / edit the sidecar JSON">Sidecar…</button>
  <label class="grp" id="ovWrap" style="display:none" title="Toggle the loaded sidecar's material settings">
    <input type="checkbox" id="ovToggle" checked> Apply sidecar settings
  </label>
  <label class="grp" id="starsWrap" title="Default starfield backdrop (synthetic, generated for this project)"><input type="checkbox" id="starsToggle" checked> Stars</label>
  <button id="bgChip" style="display:none" title="Remove the custom background"><span id="bgName"></span> ✕</button>
  <button id="compChip" style="display:none" title="Unload the custom component"><span id="compName"></span> ✕</button>
  <span class="grp" id="seqWrap" title="Scrub the loaded sequence (dragging pauses it)">
    <button id="seqPlay" title="Play / pause the sequence">⏸</button>
    <input type="range" id="seqScrub" min="0" max="1" step="0.01" value="0">
    <span id="seqTime">0.00 s</span>
  </span>
  <span id="links">
    <a href="https://github.com/ericwastaken/glb-turntable-viewer" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      Fork me on GitHub</a>
    <a href="https://github.com/ericwastaken/glb-turntable-viewer#readme" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M0 1.75A.75.75 0 0 1 .75 1h4.253c1.227 0 2.317.59 3 1.501A3.744 3.744 0 0 1 11.006 1h4.245a.75.75 0 0 1 .75.75v10.5a.75.75 0 0 1-.75.75h-4.507a2.25 2.25 0 0 0-1.591.659l-.622.621a.75.75 0 0 1-1.06 0l-.622-.621A2.25 2.25 0 0 0 5.258 13H.75a.75.75 0 0 1-.75-.75Zm7.251 10.324.004-5.073-.002-2.253A2.25 2.25 0 0 0 5.003 2.5H1.5v9h3.757a3.75 3.75 0 0 1 1.994.574ZM8.755 4.75l-.004 7.322a3.752 3.752 0 0 1 1.992-.572H14.5v-9h-3.495a2.25 2.25 0 0 0-2.25 2.25Z"/></svg>
      View Documentation</a>
  </span>
</div>

<div id="editor">
  <div id="editorHead">Sidecar settings (JSON) <span class="name" id="sidecarNameEl"></span></div>
  <textarea id="editorText" spellcheck="false"></textarea>
  <div id="lint"></div>
  <div id="editorBtns">
    <button id="applyBtn">Apply</button>
    <button id="clearBtn" title="Remove the sidecar entirely">Clear sidecar</button>
    <button id="closeBtn">Close</button>
    <button id="docsBtn" title="MeshPhysicalMaterial property reference (opens a new window)">three.js docs ↗</button>
  </div>
</div>

<div id="status">Loading…</div>
<div id="drop">Drop .glb, sidecar .json, component .js, icon-pack .zip, or a background image anywhere</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "js-yaml": "./vendor/js-yaml.esm.min.mjs",
    "animejs": "./vendor/animejs.esm.min.js",
    "three/examples/jsm/loaders/GLTFLoader.js": "./vendor/loaders/GLTFLoader.js",
    "three/examples/jsm/controls/OrbitControls.js": "./vendor/controls/OrbitControls.js",
    "three/examples/jsm/environments/RoomEnvironment.js": "./vendor/environments/RoomEnvironment.js",
    "three/examples/jsm/utils/BufferGeometryUtils.js": "./vendor/utils/BufferGeometryUtils.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/loaders/GLTFLoader.js';
import { OrbitControls } from './vendor/controls/OrbitControls.js';
import { RoomEnvironment } from './vendor/environments/RoomEnvironment.js';

const app = document.getElementById('app');
const status = document.getElementById('status');
const $ = id => document.getElementById(id);

// --- renderer / scene / camera -------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // needed for glass to look right
renderer.toneMappingExposure = 1.0;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// Image-based lighting so PBR + transmission materials read correctly,
// without shipping an HDRI file: RoomEnvironment is generated procedurally.
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 100);
camera.position.set(0, 0.6, 3);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;

// A subtle key light on top of the IBL, for a little sparkle.
const key = new THREE.DirectionalLight(0xffffff, 1.2);
key.position.set(3, 5, 4);
scene.add(key);

// --- background layer --------------------------------------------------------
// The backdrop lives in #bg behind the transparent canvas. Default image:
// backgrounds/starfield-default.jpg — a synthetic starfield generated for
// this project (no external assets, no licenses to credit).
const DEFAULT_BG = './backgrounds/starfield-default.jpg';
const bgEl = $('bg');
const bgState = { stars: true, custom: null, customName: '' };   // the user's choice
let componentBg = null;                                          // a loaded component/pack's choice wins
function applyBackground() {
  const bg = componentBg
    ?? (bgState.custom ? { image: bgState.custom } : (bgState.stars ? { image: DEFAULT_BG } : null));
  bgEl.style.backgroundImage = bg?.image ? `url("${bg.image}")` : 'none';
  bgEl.style.backgroundColor = bg?.color ?? 'transparent';
}
function setCustomBackground(url, name) {
  if (bgState.custom?.startsWith('blob:')) URL.revokeObjectURL(bgState.custom);
  bgState.custom = url || null; bgState.customName = name || '';
  $('bgName').textContent = name || '';
  $('bgChip').style.display = url ? 'inline-block' : 'none';
  applyBackground();
}
$('starsToggle').onchange = e => { bgState.stars = e.target.checked; applyBackground(); };
$('bgChip').onclick = () => setCustomBackground(null, '');
applyBackground();

// --- model + pivot ----------------------------------------------------------
// The model is parented under a pivot group at the world origin. The spin is
// applied to the pivot, so wherever we position the model inside it defines
// the rotation axis. "Center" mode puts the vertical axis exactly through the
// middle of the visible bounding box; "origin" keeps the axis where the file's
// author put the model origin. ?pivot=x,y,z (model units) overrides both.
const pivot = new THREE.Group();
scene.add(pivot);

const loader = new GLTFLoader();
let current = null;      // THREE.Group holding the loaded model
let mixer = null;        // plays animations embedded in the GLB, if any
let animCount = 0;       // how many clips we started on it (the mixer's own
                         // action list is private, so we keep the count)
let baseLabel = '';

const params = new URLSearchParams(location.search);
// ?ui=0 (also: none/off/false/hide) strips the viewer's own controls, leaving
// just the pack's own picture. Anything else, or absent, keeps the full UI.
const UI_OFF = /^(0|none|off|false|hide)$/i;
if (UI_OFF.test((params.get('ui') || '').trim())) document.body.classList.add('bare');
const pivotParam = (params.get('pivot') || '').split(',').map(Number);
const manualPivot = pivotParam.length === 3 && pivotParam.every(Number.isFinite)
  ? new THREE.Vector3(...pivotParam) : null;

function chainVisible(o, root) {
  for (let p = o; p; p = p.parent) { if (!p.visible) return false; if (p === root) break; }
  return true;
}

function visibleBox(obj) {
  const box = new THREE.Box3();
  obj.updateWorldMatrix(true, true);
  obj.traverse(o => {
    if (o.isMesh && chainVisible(o, obj)) box.union(new THREE.Box3().setFromObject(o));
  });
  if (box.isEmpty()) box.setFromObject(obj);
  return box;
}

function applyPivot() {
  if (!current) return;
  // Measure with the spin zeroed: a rotated pivot would skew the bounding box
  // and produce a wrong offset.
  const rotY = pivot.rotation.y;
  pivot.rotation.set(0, 0, 0);
  current.position.set(0, 0, 0);
  const box = visibleBox(current);
  const center = box.getCenter(new THREE.Vector3());
  if (manualPivot) {
    current.position.copy(manualPivot).negate();
  } else if ($('pivotSelect').value === 'center') {
    current.position.copy(center).negate();   // spin axis through bbox center
  } // 'origin': leave at 0,0,0 — spin around the authored origin
  frameCamera();                               // frame while still unrotated
  pivot.rotation.y = rotY;                     // resume the spin where it was
}

function frameCamera() {
  const box = visibleBox(pivot);
  const size = box.getSize(new THREE.Vector3()).length();
  const center = box.getCenter(new THREE.Vector3());
  const dist = size * 1.95;  // start small: model ~35% of viewport height
  camera.position.set(center.x, center.y + size * 0.15, center.z + dist);
  camera.near = size / 100; camera.far = size * 20;
  camera.updateProjectionMatrix();
  controls.target.copy(center);
  controls.update();
}

// --- sidecar material settings ----------------------------------------------
// Effects that don't survive a glTF export (e.g. glass/transmission looks) are
// described in a sidecar JSON. The sidecar is EXPLICIT: pass it with
// ?sidecar=path/to/file.json, pick it in the file dialog (multi-select with
// the model), or drag-drop it — any filename works, and one sidecar can serve
// several models. It stays loaded across model switches until cleared.
// Schema: { "materials": { "<mesh name>" | "*": { MeshPhysicalMaterial props,
// colors as hex strings } } }. Keys starting with "_" are comments.
let sidecarSpec = null;
let sidecarName = '';
const originalMats = new Map();   // mesh -> material as exported
const overrideMats = new Map();   // mesh -> sidecar-built material

const COLOR_PROPS = new Set(['color', 'attenuationColor', 'emissive', 'sheenColor', 'specularColor']);
function buildMaterial(spec) {
  const m = new THREE.MeshPhysicalMaterial();
  for (const [k, v] of Object.entries(spec)) {
    if (k.startsWith('_')) continue;
    if (COLOR_PROPS.has(k)) m[k] = new THREE.Color(v);
    else if (k in m) m[k] = v;
  }
  return m;
}

// An entry with no (non-comment) properties is a no-op placeholder: it names
// the mesh without overriding it, and "*" (if it has properties) applies.
const hasProps = s => !!s && Object.keys(s).some(k => !k.startsWith('_'));

function prepareSidecar() {
  overrideMats.clear();
  if (sidecarSpec?.materials && current) {
    const star = sidecarSpec.materials['*'];
    current.traverse(o => {
      if (!o.isMesh) return;
      const named = sidecarSpec.materials[o.name];
      const spec = hasProps(named) ? named : (hasProps(star) ? star : null);
      if (spec) overrideMats.set(o, buildMaterial(spec));
    });
  }
  $('ovWrap').style.display = overrideMats.size ? 'flex' : 'none';
  applySidecar(overrideMats.size ? $('ovToggle').checked : false);
}

function applySidecar(on) {
  if (current) current.traverse(o => {
    if (!o.isMesh) return;
    o.material = (on && overrideMats.get(o)) || originalMats.get(o) || o.material;
  });
  refreshStatus();
}

function setSidecar(spec, name) {
  sidecarSpec = spec;
  sidecarName = name;
  prepareSidecar();
  if (editor.classList.contains('open')) openEditor();   // refresh editor view
}

async function loadSidecarURL(url) {
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const res = lintSidecar(await r.text());
    setSidecar(res.spec ?? null, url.split('/').pop());
    if (!res.ok) status.textContent = `Sidecar ${url} has errors — open Sidecar… to review.`;
  } catch (err) { status.textContent = `Could not load sidecar ${url}: ${err.message}`; }
}

// --- sidecar linter -----------------------------------------------------------
// Two layers: valid JSON, then valid-for-three.js (known MeshPhysicalMaterial
// properties, right value types, mesh names that exist in the current model).
const PROP_TYPES = {
  color:'color', metalness:'unit', roughness:'unit', transmission:'unit',
  thickness:'number', ior:'number', attenuationColor:'color',
  attenuationDistance:'number', clearcoat:'unit', clearcoatRoughness:'unit',
  emissive:'color', emissiveIntensity:'number', iridescence:'unit',
  iridescenceIOR:'number', sheen:'unit', sheenColor:'color',
  sheenRoughness:'unit', specularColor:'color', specularIntensity:'unit',
  opacity:'unit', transparent:'boolean', envMapIntensity:'number',
  flatShading:'boolean', wireframe:'boolean', reflectivity:'unit',
  dispersion:'number', anisotropy:'number', anisotropyRotation:'number',
};

function lintSidecar(text) {
  let spec;
  try { spec = JSON.parse(text); }
  catch (e) { return { ok: false, msgs: [{ lvl: 'error', msg: 'Invalid JSON: ' + e.message }] }; }
  const msgs = [];
  if (typeof spec !== 'object' || spec === null || Array.isArray(spec))
    return { ok: false, msgs: [{ lvl: 'error', msg: 'Root must be a JSON object.' }] };
  for (const k of Object.keys(spec))
    if (k !== 'materials' && !k.startsWith('_'))
      msgs.push({ lvl: 'warn', msg: `Unknown root key "${k}" (only "materials" is used; "_..." keys are comments).` });
  if (!spec.materials || typeof spec.materials !== 'object' || Array.isArray(spec.materials)) {
    msgs.push({ lvl: 'error', msg: 'Missing "materials" object at the root.' });
    return { ok: false, msgs, spec };
  }
  const meshNames = new Set();
  current?.traverse(o => { if (o.isMesh && o.name) meshNames.add(o.name); });
  for (const [target, props] of Object.entries(spec.materials)) {
    if (target.startsWith('_')) continue;
    if (typeof props !== 'object' || props === null || Array.isArray(props)) {
      msgs.push({ lvl: 'error', msg: `"${target}" must map to an object of material properties.` });
      continue;
    }
    if (target !== '*' && meshNames.size && !meshNames.has(target))
      msgs.push({ lvl: 'warn', msg: `"${target}" doesn't match any mesh in the current model (meshes: ${[...meshNames].join(', ')}).` });
    if (Object.keys(props).every(k => k.startsWith('_')))
      msgs.push({ lvl: 'warn', msg: `"${target}" has no properties — it's a no-op placeholder${target === '*' ? '' : '; "*" (if it has properties) applies to this mesh'}.` });
    for (const [k, v] of Object.entries(props)) {
      if (k.startsWith('_')) continue;
      const t = PROP_TYPES[k];
      if (!t) { msgs.push({ lvl: 'warn', msg: `"${k}" is not a known MeshPhysicalMaterial property (threejs.org/docs → MeshPhysicalMaterial).` }); continue; }
      if (t === 'color' && !(typeof v === 'number' || (typeof v === 'string' && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v))))
        msgs.push({ lvl: 'error', msg: `"${k}" must be a hex color string like "#cfc6e8" (got ${JSON.stringify(v)}).` });
      else if ((t === 'number' || t === 'unit') && typeof v !== 'number')
        msgs.push({ lvl: 'error', msg: `"${k}" must be a number (got ${JSON.stringify(v)}).` });
      else if (t === 'unit' && typeof v === 'number' && (v < 0 || v > 1))
        msgs.push({ lvl: 'warn', msg: `"${k}" is usually between 0 and 1 (got ${v}).` });
      else if (t === 'boolean' && typeof v !== 'boolean')
        msgs.push({ lvl: 'error', msg: `"${k}" must be true or false (got ${JSON.stringify(v)}).` });
    }
  }
  return { ok: !msgs.some(m => m.lvl === 'error'), msgs, spec };
}

// --- sidecar editor UI ---------------------------------------------------------
const editor = $('editor');
const editorText = $('editorText');

// With no sidecar loaded, the editor opens on a skeleton generated from the
// current model: "*" with starter properties, then every mesh identified by
// name with an empty (no-op) object, ready to be filled in.
function buildSkeleton() {
  const mats = { '*': { color: '#ffffff', metalness: 0, roughness: 0.5 } };
  current?.traverse(o => { if (o.isMesh && o.name) mats[o.name] = {}; });
  return {
    _comment: 'Sidecar skeleton generated from the current model. "*" applies to every mesh without its own non-empty entry; named entries below are placeholders — add properties to override that mesh specifically.',
    materials: mats,
  };
}

function renderLint(res) {
  const lint = $('lint');
  if (res.msgs.length === 0) {
    lint.innerHTML = '<div class="ok">✓ Valid JSON, valid three.js material settings.</div>';
  } else {
    lint.innerHTML = res.msgs.map(m =>
      `<div class="${m.lvl}">${m.lvl === 'error' ? '✕' : '⚠'} ${m.msg.replace(/</g, '&lt;')}</div>`).join('') +
      (res.ok ? '<div class="ok">✓ No blocking errors — warnings only.</div>' : '');
  }
  $('applyBtn').disabled = !res.ok;
  return res;
}

function openEditor() {
  editorText.value = JSON.stringify(sidecarSpec ?? buildSkeleton(), null, 2);
  $('sidecarNameEl').textContent = sidecarName ? `· ${sidecarName}` : '· (new, from current model)';
  renderLint(lintSidecar(editorText.value));

}

$('sidecarBtn').onclick = () => editor.classList.contains('open') ? editor.classList.remove('open') : openEditor();
$('closeBtn').onclick = () => editor.classList.remove('open');
let lintTimer;
editorText.addEventListener('input', () => {
  clearTimeout(lintTimer);
  lintTimer = setTimeout(() => renderLint(lintSidecar(editorText.value)), 250);
});
$('applyBtn').onclick = () => {
  const res = renderLint(lintSidecar(editorText.value));

// --- custom component modules --------------------------------------------------
// A component is an ES module exporting `createComponent(ctx)` — the escape
// hatch for looks a sidecar can't express (custom shaders, animated layers).
// It may return an `object` (a THREE.Object3D shown in place of the model,
// under the pivot so spin works) or a `material` (applied to the loaded
// model's meshes), plus optional update(dt) / dispose() / framing hints.
// SECURITY: a component runs with full page privileges, like pasting code
// into the DevTools console. Components therefore load ONLY from this site's
// own origin (?component=relative/path.js) or from a file the user explicitly
// picks/drops. Cross-origin URLs are rejected.
let component = null;   // { name, api, kind: 'object' | 'material', root?, seq? }
                        // root: what sits under the pivot — api.object, or the
                        // wrapper Group a sequence animates; seq: the running
                        // sequence runtime (see the sequences section below)

// Components may take over pointer input (e.g. a pack icon's own drag/spin
// controller). While attached, OrbitControls stops rotating the camera (zoom
// stays) and pointer events go to the component instead.
let pointerListeners = null;
function attachPointer(p) {
  detachPointer();
  controls.enableRotate = false;
  const el = renderer.domElement;
  const down = e => { if (e.button !== undefined && e.button !== 0) return; p.down?.(e.clientX, e.clientY); el.setPointerCapture?.(e.pointerId); };
  const move = e => p.move?.(e.clientX, e.clientY);
  const up = () => p.up?.();
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointermove', move);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  pointerListeners = { down, move, up };
}
function detachPointer() {
  if (!pointerListeners) return;
  const el = renderer.domElement;
  el.removeEventListener('pointerdown', pointerListeners.down);
  el.removeEventListener('pointermove', pointerListeners.move);
  el.removeEventListener('pointerup', pointerListeners.up);
  el.removeEventListener('pointercancel', pointerListeners.up);
  pointerListeners = null;
  controls.enableRotate = true;
}

// While a SEQUENCE is live, one router owns the canvas instead of the active
// icon's own pointer handlers. It is the only place that can decide where a
// press landed, because only the sequence knows which icons are on screen —
// the big one AND the ones already sitting in rings. The router hit-tests on
// pointerdown and the runtime forwards the drag to that icon alone (AGENT.md
// §12.12). Camera ROTATION is off while it is attached; zoom is not, because
// pinch/wheel zoom is deliberately available in pack mode.
let dragListeners = null;
function attachIconDrag(router) {
  detachPointer();
  detachIconDrag();
  controls.enableRotate = false;
  const el = renderer.domElement;
  let active = null;                    // the pointerId that owns the drag
  const down = e => {
    if (e.button !== undefined && e.button !== 0) return;
    // A second finger means a pinch: give the gesture up rather than fight
    // OrbitControls for it.
    if (active !== null) { router.up(); active = null; return; }
    if (!router.down(e.clientX, e.clientY)) return;
    active = e.pointerId;
    // Synthetic pointers (a test harness) have no capture to take, and the
    // call throws rather than no-opping.
    try { el.setPointerCapture?.(e.pointerId); } catch { /* not a real pointer */ }
  };
  const move = e => { if (active === e.pointerId) router.move(e.clientX, e.clientY); };
  const up = e => { if (active !== null && active === e.pointerId) { router.up(); active = null; } };
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointermove', move);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  dragListeners = { down, move, up };
}
function detachIconDrag() {
  if (!dragListeners) return;
  const el = renderer.domElement;
  el.removeEventListener('pointerdown', dragListeners.down);
  el.removeEventListener('pointermove', dragListeners.move);
  el.removeEventListener('pointerup', dragListeners.up);
  el.removeEventListener('pointercancel', dragListeners.up);
  dragListeners = null;
  controls.enableRotate = true;
}

function unloadComponent(reloadModel = false, keepBackground = false) {
  if (!component) return;
  stopSequence();
  try { component.api.dispose?.(); } catch (e) { console.warn('component dispose:', e); }
  if (component.kind === 'object' && component.root) pivot.remove(component.root);
  if (component.kind === 'material' && current) {
    current.traverse(o => { if (o.isMesh && originalMats.has(o)) o.material = originalMats.get(o); });
  }
  detachPointer();
  detachIconDrag();
  component = null;
  if (!keepBackground) { componentBg = null; applyBackground(); }
  $('compChip').style.display = 'none';
  refreshStatus();
  if (reloadModel) modelSelect.onchange();
}

async function applyComponentApi(api, name) {
  if (api?.object) {
    if (current) { pivot.remove(current); current = null; }   // component replaces the model
    // A sequence animates scale/rise on a WRAPPER around the icon, never on
    // the icon's own object — its controller may assign rotation every frame.
    const root = api.sequence ? new THREE.Group().add(api.object) : api.object;
    pivot.add(root);
    pivot.rotation.set(0, 0, 0);
    // `frozen` is the update switch: a sequence sets it while the icon it has
    // just landed must stop being animated by its own controller.
    component = { name, api, kind: 'object', root, seq: null, frozen: false };
    // Framing is solved here, at REST pose, and never again: the sequence's
    // t=0 pose (e.g. scale 0.52, fade 0) must not shrink the framed box, and a
    // flow that swaps icons must not re-frame under the visitor.
    frameComponent(api);
  } else if (api?.material) {
    if (!current) { status.textContent = `Component ${name} provides a material — load a model first.`; return false; }
    current.traverse(o => { if (o.isMesh) o.material = api.material; });
    component = { name, api, kind: 'material' };
  } else {
    status.textContent = `Component ${name}: createComponent() must return { object }, { material }, or { icons }.`;
    return false;
  }
  componentBg = api.background ?? null;   // { image?, color? } — a component may bring its backdrop
  applyBackground();
  if (api.pointer) attachPointer(api.pointer);
  $('compName').textContent = name;
  $('compChip').style.display = 'inline-block';
  refreshStatus();
  if (api.sequence && component.kind === 'object') await startSequence(component);
  return true;
}

// --- sequences (entrance choreography from a pack's sequence.yml) ---------------
// A loaded icon may carry `api.sequence = { file, doc }` — the pack loader's
// parsed sequence.yml (AGENT.md §12). The runtime in ./sequence.js compiles it
// into a paused Anime.js timeline that the render loop drives with seek(t)
// from accumulated dt, so it is deterministic and scrubbable. Both modules are
// imported only here, so a pack without a sequence never fetches them.
const fgEl = $('fg');
const seqWrap = $('seqWrap'), seqScrub = $('seqScrub'), seqPlay = $('seqPlay'), seqTime = $('seqTime');

// The viewer holds exactly ONE live icon for a plain entrance, but a multi-step
// flow keeps the icons it has already collected on screen while the next one
// arrives. Those landed icons are reparented into `landedGroup` and dropped
// from the update path — an icon that is still being updated cannot be frozen,
// because its own controller reassigns rotation.y every frame (measured).
// Everything three.js the sequence needs lives here; sequence.js owns time,
// DOM and state and never imports three.
const GLYPH_PX = 256;
// The fraction of a ring's INNER box the glyph <img> occupies — it must match
// the `#fg .fg-slot .fg-glyph` width in the CSS above, because the glyph is
// captured through exactly that box so the PNG and the live object are the
// same silhouette at ring size.
const GLYPH_BOX = 0.76;
let glyphTarget = null;

function makeSequenceHost(comp) {
  const first = { name: comp.name, api: comp.api, wrapper: comp.root, frozen: false };
  const handles = new Map([[first.name, first]]);
  const landedGroup = new THREE.Group();
  landedGroup.name = 'sequence-landed';
  pivot.add(landedGroup);

  function setActive(h) {
    // `component.api` IS the active icon: the render loop, the status line and
    // unload all read it, so a flow swaps it rather than shadowing it. The
    // NAME goes with it — without that the status line kept announcing the
    // icon the page loaded while a completely different one was on screen.
    if (!component) return;
    if (!h) { component.frozen = true; return; }
    component.api = h.api;
    component.root = h.wrapper;
    component.name = h.name;
    component.frozen = false;
    $('compName').textContent = h.name;
    // The dropdown names the icon on screen too. Assigning `value` does not
    // fire `change`, so this labels the swap without re-loading the icon.
    if (zipState) {
      const val = 'zipicon:' + h.name;
      if (modelSelect.value !== val && [...modelSelect.options].some(o => o.value === val)) modelSelect.value = val;
    }
    refreshStatus();
    // Pointer input is NOT attached per icon here. While a sequence is live
    // one hit-testing router owns the canvas (attachIconDrag above) and
    // forwards each drag to whichever icon it actually landed on.
  }

  function setFrozen(h, on) {
    if (!!h.frozen === !!on) return;
    h.frozen = !!on;
    // attach() preserves the world transform; both parents are identity, so
    // this is a bookkeeping move, not a visual one.
    (on ? landedGroup : pivot).attach(h.wrapper);
    // An icon's visible radius is measured from its meshes AND its own current
    // scale (an icon may breathe), so re-measure at the instant it stops being
    // updated: that is the size it is going to keep.
    radii.delete(h);
    // NOTHING is written to rotation here any more. The landing tweens the
    // icon to its rest orientation across the whole flight (§12.6), so it
    // arrives already facing front; the assignment that used to live here was
    // a single-frame snap of up to 180 degrees.
  }

  function rest(h) {
    setFrozen(h, false);
    h.wrapper.position.set(0, 0, 0);
    h.wrapper.scale.setScalar(1);
    h.wrapper.rotation.set(0, 0, 0);   // the drag offset the runtime parks here
    radii.delete(h);
  }

  // --- measuring the 2D destinations ---------------------------------------------
  // A ring is a DOM element fixed to the VIEWPORT; a landed icon is in the 3D
  // world. Anything that changes the projection — a wheel or pinch zoom, a
  // window resize, a phone rotating — moves one and not the other, so the
  // world position is re-solved from the ring's CURRENT rect every frame
  // rather than measured once at landing (which drifted the object clean out
  // of its ring on the first zoom: measured [0, -67] px).
  //
  // Cost control: one getBoundingClientRect per element per FRAME (cleared by
  // beginFrame, so repeated reads inside a frame are free), and the expensive
  // getComputedStyle border read only when the rect's size actually changes.
  const rects = new Map();     // el -> { rect, innerPx }, this frame only
  const borders = new Map();   // el -> { w, h, border }, until the size changes
  const radii = new Map();     // handle -> visible radius in wrapper-local units
  const _va = new THREE.Vector3(), _vb = new THREE.Vector3(), _vc = new THREE.Vector3();

  function beginFrame() { rects.clear(); }

  function measure(el) {
    let m = rects.get(el);
    if (m) return m;
    const rect = el.getBoundingClientRect();
    let b = borders.get(el);
    if (!b || b.w !== rect.width || b.h !== rect.height) {
      const cs = getComputedStyle(el);
      b = { w: rect.width, h: rect.height,
            border: (parseFloat(cs.borderTopWidth) || 0) + (parseFloat(cs.borderBottomWidth) || 0) };
      borders.set(el, b);
    }
    m = { rect, innerPx: Math.max(1, Math.min(rect.width, rect.height) - b.border) };
    rects.set(el, m);
    return m;
  }

  function iconRadiusOf(h) {
    let r = radii.get(h);
    if (r === undefined) { r = iconRadius(h.wrapper); radii.set(h, r); }
    return r;
  }

  // The icon's visible radius about its wrapper's own origin, in wrapper-local
  // units — the number the fit is computed from. Built from each mesh's
  // GEOMETRY bounding sphere rather than an axis-aligned box, because the AABB
  // of a spinning polyhedron swings by ~20% with orientation and the icon is
  // still being spun by its controller when the fly begins. |offset| + radius
  // is invariant under rotation about the wrapper origin, so the fit is the
  // same wherever the icon happens to be pointing. Halo and outer shells are
  // meshes too, so they count.
  function iconRadius(wrapper) {
    wrapper.updateWorldMatrix(true, true);
    const inv = new THREE.Matrix4().copy(wrapper.matrixWorld).invert();
    const rel = new THREE.Matrix4(), c = new THREE.Vector3(), sc = new THREE.Vector3();
    let r = 0;
    wrapper.traverse(o => {
      if (!o.isMesh || !o.geometry) return;
      if (!o.geometry.boundingSphere) o.geometry.computeBoundingSphere();
      const bs = o.geometry.boundingSphere;
      if (!bs) return;
      rel.multiplyMatrices(inv, o.matrixWorld);
      c.copy(bs.center).applyMatrix4(rel);
      sc.setFromMatrixScale(rel);
      r = Math.max(r, c.length() + bs.radius * Math.max(sc.x, sc.y, sc.z));
    });
    return r || 0.5;
  }

  // Where a 2D element's centre is in the icon's own depth plane, and how much
  // to shrink so the icon's visible extent fits inside the target's inner
  // circle. A straight line at constant depth, because both ends are on the
  // same plane. `depth` is a distance IN FRONT OF THE CAMERA, fixed once per
  // landing: hold that and the icon rides along with a zoom exactly as the
  // DOM ring does, instead of sliding out of it.
  function anchorWorld(h, el, fit, depth) {
    const { rect, innerPx } = measure(el);
    const vw = Math.max(1, innerWidth), vh = Math.max(1, innerHeight);
    const fwd = camera.getWorldDirection(_va);
    const ndc = _vb.set(((rect.left + rect.width / 2) / vw) * 2 - 1,
                        -((rect.top + rect.height / 2) / vh) * 2 + 1, 0.5).unproject(camera);
    const dir = ndc.sub(camera.position).normalize();
    const world = _vc.copy(camera.position).addScaledVector(dir, depth / Math.max(1e-6, dir.dot(fwd)));
    // The fit is re-derived too, so a ring that changes size (a resize, or a
    // phone turning: `size` is a vmin fraction) keeps the authored ratio.
    const pxPerWorld = vh / (2 * depth * Math.tan((camera.fov * Math.PI / 180) / 2));
    const s = (innerPx * fit) / (2 * iconRadiusOf(h) * pxPerWorld);
    return { world, s, innerPx, rect };
  }

  // The same thing in the wrapper's own parent space — what the runtime writes.
  function anchor(h, el, fit, depth) {
    const a = anchorWorld(h, el, fit, depth);
    const local = (h.wrapper.parent ?? pivot).worldToLocal(a.world.clone());
    return { x: local.x, y: local.y, z: local.z, s: a.s };
  }

  function planMove(h, el, fit) {
    const w = h.wrapper;
    const from = { x: w.position.x, y: w.position.y, z: w.position.z, s: w.scale.x };
    const start = w.getWorldPosition(new THREE.Vector3());
    const fwd = camera.getWorldDirection(new THREE.Vector3());
    const depth = Math.max(1e-4, start.sub(camera.position).dot(fwd));
    return { from, depth, to: anchor(h, el, fit, depth) };
  }

  // Which icon did a press land on? Every candidate is projected to screen
  // along with its own visible radius; the grab zone is that radius plus
  // `padding` of it, and the nearest hit wins. Nothing near enough wins
  // nothing — a drag on empty canvas must rotate nothing at all.
  function hitTest(list, x, y, padding) {
    const vw = Math.max(1, innerWidth), vh = Math.max(1, innerHeight);
    const fwd = camera.getWorldDirection(_va);
    const halfFov = Math.tan((camera.fov * Math.PI / 180) / 2);
    let best = null, bestD = Infinity;
    for (const h of list) {
      const w = h.wrapper;
      const world = w.getWorldPosition(_vb);
      const depth = _vc.copy(world).sub(camera.position).dot(fwd);
      if (depth <= 1e-4) continue;                       // behind the camera
      const p = world.project(camera);                   // world is a scratch vector
      const sx = (p.x * 0.5 + 0.5) * vw, sy = (-p.y * 0.5 + 0.5) * vh;
      const rPx = iconRadiusOf(h) * w.scale.x * (vh / (2 * depth * halfFov)) * (1 + padding);
      const d = Math.hypot(x - sx, y - sy);
      if (d <= rPx && d < bestD) { best = h; bestD = d; }
    }
    return best;
  }

  // A slot's glyph. Provided wins: `glyphs:` in icons.yml reaches us as
  // api.glyph. Otherwise it is DERIVED — rendered once, offscreen, at the
  // icon's rest orientation, so every mark is framed the same way and none of
  // them depends on where the icon happened to be rotated when it was
  // collected. Captured at preload for exactly that reason.
  //
  // `dest` is { el, fit } — the ring this icon is going to land in. With it,
  // the capture uses the MAIN camera cropped (setViewOffset) to the glyph
  // box inside that ring, with the object placed exactly where and at exactly
  // the size the landed object will be: the PNG is then the same projection,
  // the same framing and the same silhouette as the live object it replaces,
  // so the cross-fade between them has nothing to give away. Without a `dest`
  // (an icon no step lands) it falls back to a bounding-sphere frame.
  function glyphFor(h, dest) {
    if (typeof h.api.glyph === 'string' && h.api.glyph) return h.api.glyph;
    const obj = h.api.object;
    const parent = obj.parent, rot = obj.rotation.clone(), wasVisible = obj.visible;
    const gs = new THREE.Scene();
    gs.environment = scene.environment;
    const light = new THREE.DirectionalLight(0xffffff, 1.2);
    light.position.copy(key.position);          // the page's own key light
    gs.add(light);
    const holder = new THREE.Group();           // stands in for the icon's wrapper
    gs.add(holder);
    let url = null;
    try {
      // The orientation a landing now ARRIVES at, so the mark and the object
      // it replaces are the same view of the same thing.
      obj.rotation.set(0, 0, 0);
      obj.visible = true;
      let cam;
      if (dest) {
        beginFrame();                           // fresh rects for this capture
        const w = h.wrapper;
        const start = w.getWorldPosition(new THREE.Vector3());
        const fwd = camera.getWorldDirection(new THREE.Vector3());
        const depth = Math.max(1e-4, start.sub(camera.position).dot(fwd));
        const a = anchorWorld(h, dest.el, dest.fit, depth);
        holder.position.copy(a.world);
        holder.scale.setScalar(a.s);
        holder.add(obj);                        // temporarily; restored in `finally`
        const boxPx = a.innerPx * GLYPH_BOX;    // the <img>'s box inside the ring
        cam = camera.clone();
        cam.setViewOffset(Math.max(1, innerWidth), Math.max(1, innerHeight),
          a.rect.left + a.rect.width / 2 - boxPx / 2,
          a.rect.top + a.rect.height / 2 - boxPx / 2, boxPx, boxPx);
        cam.updateProjectionMatrix();
      } else {
        holder.add(obj);
        const sphere = new THREE.Box3().setFromObject(obj).getBoundingSphere(new THREE.Sphere());
        cam = new THREE.PerspectiveCamera(40, 1, 0.01, 1000);
        const dist = (sphere.radius || 1) / Math.tan((40 * Math.PI / 180) / 2) * 1.08;   // a little air
        cam.position.set(sphere.center.x, sphere.center.y, sphere.center.z + dist);
        cam.lookAt(sphere.center);
      }
      if (!glyphTarget) {
        glyphTarget = new THREE.WebGLRenderTarget(GLYPH_PX, GLYPH_PX);
        // Without this the readback is linear-light and the mark comes out
        // dark; with it three encodes exactly as it does for the canvas.
        glyphTarget.texture.colorSpace = THREE.SRGBColorSpace;
      }
      const prevTarget = renderer.getRenderTarget(), prevAlpha = renderer.getClearAlpha();
      renderer.setRenderTarget(glyphTarget);
      renderer.setClearAlpha(0);
      renderer.clear(true, true, true);
      renderer.render(gs, cam);
      const buf = new Uint8Array(GLYPH_PX * GLYPH_PX * 4);
      renderer.readRenderTargetPixels(glyphTarget, 0, 0, GLYPH_PX, GLYPH_PX, buf);
      renderer.setRenderTarget(prevTarget);
      renderer.setClearAlpha(prevAlpha);

      const cv = document.createElement('canvas');
      cv.width = GLYPH_PX; cv.height = GLYPH_PX;
      const img = new ImageData(GLYPH_PX, GLYPH_PX);
      for (let y = 0; y < GLYPH_PX; y++) {           // GL reads bottom-up
        const src = (GLYPH_PX - 1 - y) * GLYPH_PX * 4, dst = y * GLYPH_PX * 4;
        img.data.set(buf.subarray(src, src + GLYPH_PX * 4), dst);
      }
      cv.getContext('2d').putImageData(img, 0, 0);
      url = cv.toDataURL('image/png');
    } catch (err) {
      console.warn('[sequence] could not derive a glyph for', h.name, err);
    } finally {
      (parent ?? h.wrapper).add(obj);
      obj.rotation.copy(rot);
      obj.visible = wasVisible;
      light.dispose();
    }
    return url;
  }

  return {
    root: fgEl, initialHandle: first, iconName: comp.name, file: comp.api.sequence.file,
    packId: zipState?.label ?? comp.name,
    picked: packIconPicked,
    iconNames: zipState?.icons ? Object.keys(zipState.icons) : [comp.name],
    async acquire(name) {
      if (handles.has(name)) return handles.get(name);
      const api = await zipState.icons[name]();
      const wrapper = new THREE.Group().add(api.object);
      wrapper.visible = false;
      pivot.add(wrapper);
      const h = { name, api, wrapper, frozen: false };
      handles.set(name, h);
      return h;
    },
    setActive, setFrozen, rest, planMove, anchor, hitTest, glyphFor, beginFrame,
    attachDrag: attachIconDrag, detachDrag: detachIconDrag,
    dispose() {
      // Everything this host built is released here; the icon the page loaded
      // is handed back to unloadComponent() exactly as it found it.
      for (const h of handles.values()) {
        if (h === first) continue;
        try { h.api.dispose?.(); } catch (e) { console.warn('icon dispose:', e); }
        h.wrapper.parent?.remove(h.wrapper);
      }
      handles.clear();
      rects.clear(); borders.clear(); radii.clear();
      pivot.attach(first.wrapper);
      pivot.remove(landedGroup);
      detachIconDrag();
      if (component) {
        component.api = first.api; component.root = first.wrapper; component.frozen = false;
        component.name = first.name;
        $('compName').textContent = first.name;
        detachPointer();
        if (first.api.pointer) attachPointer(first.api.pointer);
        refreshStatus();
      }
    },
  };
}

async function startSequence(comp) {
  const api = comp.api, root0 = comp.root;
  root0.visible = false;   // no flash of the rest pose while the module loads
  let seq = null;
  try {
    const { createSequence } = await import('./sequence.js');
    seq = createSequence(api.sequence.doc, makeSequenceHost(comp));
  } catch (err) {
    status.textContent = `${api.sequence.file}: ${err.message}`;
    console.error(err);
  }
  if (component !== comp) { seq?.dispose(); return; }   // the user moved on while we loaded
  // A running sequence owns visibility from here (a flow may be starting on a
  // different icon than the one the page loaded); only restore it ourselves
  // when there is no sequence to hand it to.
  if (!seq) root0.visible = true;
  comp.seq = seq;
  syncSequenceUI();
  refreshStatus();   // a live sequence changes what a drag does (§12.12)
}

function stopSequence() {
  component?.seq?.dispose();
  if (component) component.seq = null;
  fgEl.replaceChildren();
  syncSequenceUI();
}

// The transport is a design-review aid: drag = pause + seek, ▶/⏸ toggles. It
// scrubs the CURRENT phase — a flow's entrance or its transition — so its
// range follows the phase, and it never writes persisted flow state.
const seqUi = { time: -1, playing: null, duration: -1 };   // what the transport last showed
function syncSequenceUI() {
  const s = component?.seq;
  seqWrap.style.display = s ? 'flex' : 'none';
  if (!s) { seqUi.time = -1; seqUi.playing = null; seqUi.duration = -1; return; }
  seqScrub.max = s.duration;
  seqScrub.value = s.time;
  seqTime.textContent = s.flow ? `${s.time.toFixed(2)} s · ${s.step}` : `${s.time.toFixed(2)} s`;
  seqPlay.textContent = s.playing ? '⏸' : '▶';
  seqUi.time = s.time; seqUi.playing = s.playing; seqUi.duration = s.duration;
}
seqScrub.oninput = () => { const s = component?.seq; if (!s) return; s.pause(); s.seek(parseFloat(seqScrub.value)); syncSequenceUI(); };
seqPlay.onclick = () => { const s = component?.seq; if (!s) return; s.playing ? s.pause() : s.play(); syncSequenceUI(); };

async function activateComponent(mod, name, assetPath) {
  if (typeof mod.createComponent !== 'function') {
    status.textContent = `Component ${name}: module has no createComponent() export.`;
    return;
  }
  unloadComponent();
  let api;
  try {
    api = await mod.createComponent({ THREE, renderer, scene, camera, assetPath });
  } catch (err) {
    status.textContent = `Component ${name} failed to start: ${err.message}`;
    console.error(err); return;
  }
  // Icon pack: { icons: { name: async () => api } } — dropdown swaps to the
  // pack's contents plus an "unload" entry.
  if (api?.icons && typeof api.icons === 'object' && !Array.isArray(api.icons)) {
    await enterPack(name, api.icons);
    return;
  }
  await applyComponentApi(api, name);
}

// --- icon packs / zip mode -----------------------------------------------------
// While a pack (usually from a dropped zip) is active, the model dropdown
// lists ONLY the pack's icons plus one entry to unload and return to the
// bundled samples. The original dropdown is restored on unload.
// `source` is how the pack arrived — 'zip' for a dropped file, 'pack' for a
// folder loaded with ?component=. It is the word the status line and the
// unload entry use, so a pack loaded by URL is never called a zip.
let zipState = null;   // { source, label, savedHTML, savedValue, savedSpin, icons }
// True while the icon being activated was chosen by a human from the dropdown
// rather than by the pack itself. A sequence flow uses it to jump to that
// icon's step for design review — and never to write persisted state.
let packIconPicked = false;

function swapDropdown(label, iconNames) {
  if (!zipState.savedHTML) {
    zipState.savedHTML = modelSelect.innerHTML;
    zipState.savedValue = modelSelect.value;
  }
  modelSelect.innerHTML = '';
  for (const n of iconNames) {
    const o = document.createElement('option');
    o.value = 'zipicon:' + n;
    o.textContent = n;
    modelSelect.appendChild(o);
  }
  const u = document.createElement('option');
  u.value = '__unloadzip__';
  u.textContent = `⏏ Unload ${zipState.source} (back to samples)`;
  modelSelect.appendChild(u);
  if (iconNames.length) modelSelect.value = 'zipicon:' + iconNames[0];
}

// A pack owns its own motion, materials, and framing, so the turntable and
// sidecar controls are hidden and the spin slider is zeroed while one is
// loaded. Both load paths call this, so pack mode looks the same either way.
// Idempotent: the user's spin is remembered only on the first call.
function enterPackMode() {
  if (zipState.savedSpin === undefined) zipState.savedSpin = $('speed').value;
  $('speed').value = 0;
  document.body.classList.add('zipmode');
}

async function enterPack(label, icons) {
  const names = Object.keys(icons);
  if (!names.length) { status.textContent = `${label}: the pack lists no icons.`; return; }
  // No zipState yet means this pack came from ?component=, with no zip involved.
  zipState = zipState ?? { source: 'pack', label, savedHTML: null, savedValue: null, icons: null };
  zipState.icons = icons;
  enterPackMode();
  swapDropdown(label, names);
  await activatePackIcon(names[0]);
}

async function activatePackIcon(name, picked = false) {
  unloadComponent(false, true);   // keep the backdrop while switching icons (no flash)
  status.textContent = `Loading ${name}…`;
  let api;
  try { api = await zipState.icons[name](); }
  catch (err) { status.textContent = `Icon ${name} failed: ${err.message}`; console.error(err); return; }
  packIconPicked = picked;
  await applyComponentApi(api, name);
  packIconPicked = false;
}

function unloadZip(reloadDefault) {
  if (!zipState) return;
  unloadComponent();
  const { savedHTML, savedValue, savedSpin } = zipState;
  zipState = null;
  document.body.classList.remove('zipmode');
  if (savedSpin !== undefined) $('speed').value = savedSpin;
  caches.open('zipfs').then(async c => { for (const k of await c.keys()) c.delete(k); }).catch(() => {});
  if (savedHTML !== null) {
    modelSelect.innerHTML = savedHTML;
    modelSelect.value = savedValue || modelSelect.options[0].value;
  }
  if (reloadDefault) modelSelect.onchange();
}

// --- zip loading (fflate + zipfs service worker) --------------------------------
const MIME = { js: 'text/javascript', mjs: 'text/javascript', json: 'application/json',
  glb: 'model/gltf-binary', gltf: 'model/gltf+json', jpg: 'image/jpeg', jpeg: 'image/jpeg',
  png: 'image/png', webp: 'image/webp', svg: 'image/svg+xml', html: 'text/html', css: 'text/css' };
const mimeFor = p => MIME[p.split('.').pop().toLowerCase()] || 'application/octet-stream';

async function ensureZipfs() {
  if (!('serviceWorker' in navigator)) {
    throw new Error('this browser blocks service workers (private window?). Zip loading needs a normal window.');
  }
  await navigator.serviceWorker.register('./sw.js');
  await navigator.serviceWorker.ready;
  if (!navigator.serviceWorker.controller) {
    await new Promise(res => {
      const t = setTimeout(res, 1500);
      navigator.serviceWorker.addEventListener('controllerchange', () => { clearTimeout(t); res(); }, { once: true });
    });
  }
  if (!navigator.serviceWorker.controller) {
    throw new Error('the zip filesystem worker did not take control — reload the page and drop the zip again.');
  }
}

async function loadZipFile(f) {
  status.textContent = `Reading ${f.name}…`;
  if (zipState) unloadZip(false);
  let entries;
  try {
    const { unzipSync } = await import('./vendor/fflate.module.js');
    entries = unzipSync(new Uint8Array(await f.arrayBuffer()));
  } catch (err) {
    status.textContent = `Could not read ${f.name}: ${err.message}`;
    return;
  }
  // Drop folder records and macOS zip junk.
  let files = Object.entries(entries).filter(([p]) =>
    !p.endsWith('/') && !p.startsWith('__MACOSX/') &&
    !p.split('/').pop().startsWith('._') && !p.endsWith('.DS_Store'));
  // Unwrap the single top-level folder that Finder's Compress creates.
  const roots = new Set(files.map(([p]) => p.split('/')[0]));
  const prefix = (roots.size === 1 && files.every(([p]) => p.includes('/'))) ? [...roots][0] + '/' : '';
  files = files.map(([p, data]) => [p.slice(prefix.length), data]).filter(([p]) => p);

  let entry = files.find(([p]) => p === 'component.js')?.[0];
  if (!entry) {
    const cands = files.filter(([p]) => p.endsWith('.component.js'));
    if (cands.length === 1) entry = cands[0][0];
  }
  if (!entry) {
    status.textContent = `${f.name}: no component.js found at the top of the zip (see the README's packaging section).`;
    return;
  }

  try { await ensureZipfs(); }
  catch (err) { status.textContent = `Zip loading unavailable: ${err.message}`; return; }

  const id = 'z' + Date.now().toString(36);
  const base = new URL(`zipfs/${id}/`, location.href).href;
  const cache = await caches.open('zipfs');
  for (const k of await cache.keys()) cache.delete(k);
  await Promise.all(files.map(([p, data]) =>
    cache.put(base + p, new Response(data, { headers: { 'Content-Type': mimeFor(p) } }))));

  status.textContent = `Loading ${f.name}…`;
  try {
    const mod = await import(base + entry);
    zipState = { source: 'zip', label: f.name, savedHTML: null, savedValue: null, icons: null };
    enterPackMode();   // a dropped zip is package-owned even if it holds no icons
    await activateComponent(mod, f.name, base);
    if (!zipState.icons) swapDropdown(f.name, []);   // non-pack zip: still offer the unload entry
  } catch (err) {
    status.textContent = `Could not load ${f.name}: ${err.message}`;
    console.error(err);
    unloadZip(false);
  }
}

function frameComponent(api) {
  const box = visibleBox(pivot);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const f = api.framing;
  const halfFov = (camera.fov * Math.PI / 180) / 2;
  if (f?.heightFraction) {
    // Honor the component's composition: its height as a fraction of the
    // viewport, its vertical center as a fraction from the top.
    const hf = Math.min(1, Math.max(0.05, f.heightFraction));
    const dist = (size.y / (2 * hf)) / Math.tan(halfFov);
    const vc = f.verticalCenter ?? 0.5;
    const yShift = (0.5 - vc) * 2 * dist * Math.tan(halfFov);
    controls.target.set(center.x, center.y - yShift, center.z);
    camera.position.set(center.x, center.y - yShift, center.z + dist);
    camera.near = Math.max(0.01, dist / 100); camera.far = dist * 20;
    camera.updateProjectionMatrix();
    controls.update();
  } else {
    frameCamera();
  }
}

async function loadComponentURL(path) {
  let url;
  try { url = new URL(path, location.href); } catch { status.textContent = `Bad component path: ${path}`; return; }
  if (url.origin !== location.origin) {
    status.textContent = 'Components only load from this site\'s own address (a relative path). Remote URLs are not allowed.';
    return;
  }
  status.textContent = `Loading component ${path}…`;
  try {
    const mod = await import(url.href);
    await activateComponent(mod, url.pathname.split('/').pop(), url.href.slice(0, url.href.lastIndexOf('/') + 1));
  } catch (err) {
    status.textContent = `Could not load component ${path}: ${err.message}`;
    console.error(err);
  }
}

async function loadComponentFile(f) {
  const blobUrl = URL.createObjectURL(f);
  try {
    const mod = await import(blobUrl);
    await activateComponent(mod, f.name, './');
  } catch (err) {
    status.textContent = `Component ${f.name} failed to load — dropped files must be single-file modules (no relative imports). For folder packages, serve them and use ?component=. (${err.message})`;
    console.error(err);
  }
}

$('compChip').onclick = () => { if (zipState) unloadZip(true); else unloadComponent(true); };

// --- model loading -----------------------------------------------------------
function refreshStatus() {
  const sc = overrideMats.size
    ? ($('ovToggle').checked ? ` • sidecar ${sidecarName} ON` : ` • sidecar ${sidecarName} off (as exported)`)
    : (sidecarSpec ? ` • sidecar ${sidecarName} matches no meshes` : '');
  const comp = component
    ? (zipState ? ` • ${zipState.source} ${zipState.label}` : ` • component ${component.name} (${component.kind})`)
    : '';
  const shown = component?.kind === 'object' ? component.name : baseLabel;
  // A sequence routes drags to whichever icon was actually grabbed, so an
  // icon with no pointer handlers of its own is draggable too (AGENT.md §12.12).
  const drag = (component?.seq || component?.api.pointer) ? 'drag to spin the icon' : 'drag to orbit';
  status.textContent = `${shown} • ${drag}, wheel/pinch to zoom` + comp +
    (animCount ? ` • ${animCount} embedded animation${animCount > 1 ? 's' : ''} playing` : ' • no embedded animations (spin is ours)') + sc;
}

function setModel(gltf, label) {
  if (zipState) unloadZip(false);   // loading a model exits zip mode
  unloadComponent();   // a fresh model starts clean; reload the component after if wanted
  if (current) { pivot.remove(current); current.traverse(o => { o.geometry?.dispose?.(); }); }
  mixer = null;
  animCount = 0;
  originalMats.clear();
  current = gltf.scene;
  // Hide backdrop/stage meshes some sample models ship with — we only want the hero.
  current.traverse(o => { if (/backdrop|stage|floor|ground/i.test(o.name)) o.visible = false; });
  current.traverse(o => { if (o.isMesh) originalMats.set(o, o.material); });
  pivot.add(current);
  pivot.rotation.set(0, 0, 0);
  applyPivot();
  if (gltf.animations?.length) {
    mixer = new THREE.AnimationMixer(current);
    gltf.animations.forEach(clip => mixer.clipAction(clip).play());
    animCount = gltf.animations.length;
  }
  baseLabel = label;
  prepareSidecar();   // re-match the (sticky) sidecar against the new meshes
  refreshStatus();
  if (pendingComponentPath) {
    const p = pendingComponentPath; pendingComponentPath = null;
    loadComponentURL(p);
  }
}

function loadURL(url, label) {
  status.textContent = `Loading ${label}…`;
  loader.load(url, g => setModel(g, label),
    xhr => { if (xhr.total) status.textContent = `Loading ${label}… ${Math.round(xhr.loaded / xhr.total * 100)}%`; },
    err => { status.textContent = `Failed to load ${label}: ${err.message ?? err}`; console.error(err); });
}

// --- UI ----------------------------------------------------------------------
const speedInput = $('speed');
const pauseBtn = $('pauseBtn');
let paused = false;
pauseBtn.onclick = () => { paused = !paused; pauseBtn.textContent = paused ? 'Resume' : 'Pause'; };

const modelSelect = $('modelSelect');
// A row's value identifies the row; the file it loads is data-model. Rows added
// at runtime for custom loads carry the URL in value itself and have no
// data-model, so this covers both.
const modelSrc = opt => opt.dataset.model || opt.value;
modelSelect.onchange = () => {
  const v = modelSelect.value;
  if (v === '__unloadzip__') { unloadZip(true); return; }
  if (v.startsWith('zipicon:')) { activatePackIcon(v.slice(8), true); return; }
  const opt = modelSelect.selectedOptions[0];
  if (opt.dataset.sidecar) loadSidecarURL(opt.dataset.sidecar);
  loadURL(modelSrc(opt), opt.textContent);
};

$('pivotSelect').onchange = () => applyPivot();
$('ovToggle').onchange = e => applySidecar(e.target.checked);

// Custom loads (URL param, file picker, drag-drop) get their own dropdown
// entry showing the file name and where it came from, so the selector always
// reflects what is actually on screen.
function selectCustom(name, sourceTag, value) {
  let opt = document.getElementById('customOpt');
  if (!opt) {
    opt = document.createElement('option');
    opt.id = 'customOpt';
    modelSelect.appendChild(opt);
  }
  opt.value = value;
  opt.textContent = `${name} (${sourceTag})`;
  modelSelect.value = value;
}

// Accepts any mix of one model file and one sidecar .json, in one gesture.
async function handleFiles(files) {
  const list = [...files];
  const zip = list.find(f => f.name.toLowerCase().endsWith('.zip'));
  if (zip) { loadZipFile(zip); return; }   // a zip is a complete package: exclusive
  const json = list.find(f => f.name.toLowerCase().endsWith('.json'));
  const model = list.find(f => /\.(glb|gltf)$/i.test(f.name));
  const js = list.find(f => f.name.toLowerCase().endsWith('.js'));
  const img = list.find(f => /\.(png|jpe?g|webp)$/i.test(f.name));
  if (img) setCustomBackground(URL.createObjectURL(img), img.name);
  if (json) {
    try {
      const text = await json.text();
      const res = lintSidecar(text);
      if (!res.ok) { status.textContent = `Sidecar ${json.name} has errors — open Sidecar… to fix.`; }
      setSidecar(res.spec ?? null, json.name);
      if (res.spec && !editor.classList.contains('open') && !res.ok) { openEditor(); editorText.value = text; renderLint(res); }
    } catch (err) { status.textContent = `Could not read ${json.name}: ${err.message}`; }
  }
  if (model) {
    const url = URL.createObjectURL(model);
    selectCustom(model.name, 'file', url);
    loadURL(url, model.name);
  } else if (json) {
    prepareSidecar();   // sidecar-only: apply to whatever is on screen
  }
  if (js) loadComponentFile(js);   // after any model in the same gesture
}
$('filePick').onchange = e => { if (e.target.files.length) handleFiles(e.target.files); };

// Drag & drop .glb and/or sidecar .json from Finder (together or separately).
const drop = $('drop');
addEventListener('dragover', e => { e.preventDefault(); drop.style.display = 'flex'; });
drop.addEventListener('dragleave', () => drop.style.display = 'none');
addEventListener('drop', e => {
  e.preventDefault(); drop.style.display = 'none';
  if (e.dataTransfer.files?.length) handleFiles(e.dataTransfer.files);
});

// ?model=path.glb picks the model; ?sidecar=path.json loads material settings;
// ?component=relative/path.js loads a custom component (same-origin only).
// The sidecar is never assumed from the model name — it must be passed.
let pendingComponentPath = params.get('component');
(async () => {
  const bgp = params.get('bg');
  if (bgp) {
    try {
      const u = new URL(bgp, location.href);
      if (u.origin === location.origin) setCustomBackground(u.href, bgp.split('/').pop());
      else status.textContent = 'Backgrounds only load from this site\'s own address (a relative path).';
    } catch { status.textContent = `Bad background path: ${bgp}`; }
  }
  const sc = params.get('sidecar');
  if (sc) await loadSidecarURL(sc);
  const qs = params.get('model');
  if (qs) {
    selectCustom(qs.split('/').pop(), 'URL', qs);
    loadURL(qs, qs.split('/').pop());
  } else {
    const opt = modelSelect.selectedOptions[0];
    loadURL(modelSrc(opt), opt.textContent);
  }
})();

// --- render loop ---------------------------------------------------------------
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if ((current || component?.kind === 'object') && !paused)
    pivot.rotation.y += dt * parseFloat(speedInput.value);
  // `frozen` is set by a sequence for an icon it has landed in a slot: it must
  // stop being updated BEFORE its resting orientation can stick, because the
  // icon's own controller reassigns rotation every frame.
  try { if (!component?.frozen) component?.api.update?.(dt); } catch (e) { console.error('component update:', e); }
  // The pack's own update runs FIRST (its controller assigns rotation), then
  // the sequence advances the wrapper/overlay. They never share a property.
  const seq = component?.seq;
  if (seq) {
    // ALWAYS, not only while playing: a held phase still has to re-anchor its
    // landed objects to their rings (the camera and the viewport can change
    // under a finished sequence) and still has to settle a spring-back.
    seq.update(dt);
    // Keep the transport honest after a programmatic seek() too (e.g. from the
    // console); only touch the DOM when something actually changed.
    if (seq.time !== seqUi.time || seq.playing !== seqUi.playing || seq.duration !== seqUi.duration) syncSequenceUI();
  }
  mixer?.update(dt);
  controls.update();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Debug handle for console experiments (material tweaks, inspection).
window.viewer = { THREE, scene, camera, renderer, pivot, controls,
  get model() { return current; }, get component() { return component; },
  get sequence() { return component?.seq ?? null; } };   // { duration, time, seek(t), play(), pause(), … } or null
</script>
</body>
</html>
