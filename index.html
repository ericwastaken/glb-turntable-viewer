<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GLB Turntable Viewer (three.js)</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 120%, #1c1c22 0%, #101014 55%, #08080a 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #cfd6ea;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 10px 12px;
    background: linear-gradient(#04060fcc, transparent);
    pointer-events: none;
  }
  #hud > * { pointer-events: auto; }
  select, button, label.file {
    background: #141b33; color: #cfd6ea;
    border: 1px solid #2a3560; border-radius: 8px;
    padding: 6px 10px; font-size: 13px; cursor: pointer;
  }
  select:hover, button:hover, label.file:hover { border-color: #4257a0; }
  input[type="file"] { display: none; }
  input[type="range"] { accent-color: #5d79e6; width: 110px; }
  .grp { display: flex; align-items: center; gap: 6px; font-size: 12px; opacity: .9; }

  #status {
    position: fixed; bottom: 10px; left: 12px; right: 12px;
    font-size: 12px; opacity: .75; text-align: center;
    text-shadow: 0 1px 3px #000;
  }
  #drop {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: #04060fd0; border: 3px dashed #4257a0;
    font-size: 20px; z-index: 10;
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <select id="modelSelect" title="Pick a bundled model">
    <option value="models/DragonAttenuation.glb">Glass dragon (transmission)</option>
    <option value="models/MosquitoInAmber.glb">Mosquito in amber (deep glass volume)</option>
    <option value="models/GlassVaseFlowers.glb">Glass vase with flowers</option>
    <option value="models/GlassHurricaneCandleHolder.glb">Glass hurricane candle holder</option>
    <option value="models/IridescentDishWithOlives.glb">Iridescent glass dish</option>
    <option value="models/DispersionTest.glb">Dispersion test (prism glass)</option>
    <option value="models/DamagedHelmet.glb">Damaged helmet (PBR classic)</option>
  </select>
  <label class="file">Load .glb…<input type="file" id="filePick" accept=".glb,.gltf"></label>
  <span class="grp">Spin <input type="range" id="speed" min="0" max="3" step="0.05" value="0.3"></span>
  <button id="pauseBtn" title="Pause / resume spin">Pause</button>
</div>

<div id="status">Loading…</div>
<div id="drop">Drop a .glb anywhere</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/loaders/GLTFLoader.js';
import { OrbitControls } from './vendor/controls/OrbitControls.js';
import { RoomEnvironment } from './vendor/environments/RoomEnvironment.js';

const app = document.getElementById('app');
const status = document.getElementById('status');

// --- renderer / scene / camera -------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // needed for glass to look right
renderer.toneMappingExposure = 1.0;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// Image-based lighting so PBR + transmission materials read correctly,
// without shipping an HDRI file: RoomEnvironment is generated procedurally.
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 100);
camera.position.set(0, 0.6, 3);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;

// A subtle key light on top of the IBL, for a little sparkle.
const key = new THREE.DirectionalLight(0xffffff, 1.2);
key.position.set(3, 5, 4);
scene.add(key);

// Simple procedural starfield backdrop: generated in code (random points),
// plain white/gray stars on a neutral charcoal sky. Not derived from any asset.
{
  const N = 700, pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = 22 + Math.random() * 18;
    const t = Math.random() * Math.PI * 2, p = Math.acos(2 * Math.random() - 1);
    pos.set([r * Math.sin(p) * Math.cos(t), r * Math.cos(p), r * Math.sin(p) * Math.sin(t)], i * 3);
    const v = 0.55 + Math.random() * 0.45;   // white to soft gray, no color
    col.set([v, v, v], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const stars = new THREE.Points(g, new THREE.PointsMaterial({
    size: 0.09, vertexColors: true, sizeAttenuation: true, transparent: true, opacity: 0.85,
  }));
  scene.add(stars);
}

// --- model loading ---------------------------------------------------------
const loader = new GLTFLoader();
let current = null;      // THREE.Group holding the loaded model
let mixer = null;        // plays animations embedded in the GLB, if any

function frameObject(obj) {
  // Center the model and pull the camera back to fit it, whatever its size.
  // Only count visible meshes (hidden backdrops would skew the framing).
  const box = new THREE.Box3();
  obj.updateWorldMatrix(true, true);
  const chainVisible = o => { for (let p = o; p; p = p.parent) { if (!p.visible) return false; if (p === obj) break; } return true; };
  obj.traverse(o => {
    if (o.isMesh && chainVisible(o)) box.union(new THREE.Box3().setFromObject(o));
  });
  if (box.isEmpty()) box.setFromObject(obj);
  const size = box.getSize(new THREE.Vector3()).length();
  const center = box.getCenter(new THREE.Vector3());
  obj.position.sub(center);
  const dist = size * 1.95;  // start small: model ~35% of viewport height
  camera.position.set(0, size * 0.15, dist);
  camera.near = size / 100; camera.far = size * 20;
  camera.updateProjectionMatrix();
  controls.target.set(0, 0, 0);
  controls.update();
}

function setModel(gltf, label) {
  if (current) { scene.remove(current); current.traverse(o => { o.geometry?.dispose?.(); }); }
  mixer = null;
  current = gltf.scene;
  // Hide backdrop/stage meshes some sample models ship with (e.g. the
  // checkerboard "Cloth Backdrop" in DragonAttenuation) — we only want the hero.
  current.traverse(o => { if (/backdrop|stage|floor|ground/i.test(o.name)) o.visible = false; });
  scene.add(current);
  frameObject(current);
  if (gltf.animations?.length) {
    mixer = new THREE.AnimationMixer(current);
    gltf.animations.forEach(clip => mixer.clipAction(clip).play());
  }
  const anims = gltf.animations?.length ?? 0;
  status.textContent = `${label} • drag to orbit, wheel/pinch to zoom` +
    (anims ? ` • ${anims} embedded animation${anims > 1 ? 's' : ''} playing` : ' • no embedded animations (spin is ours)');
}

function loadURL(url, label) {
  status.textContent = `Loading ${label}…`;
  loader.load(url, g => setModel(g, label),
    xhr => { if (xhr.total) status.textContent = `Loading ${label}… ${Math.round(xhr.loaded / xhr.total * 100)}%`; },
    err => { status.textContent = `Failed to load ${label}: ${err.message ?? err}`; console.error(err); });
}

// --- UI --------------------------------------------------------------------
const speedInput = document.getElementById('speed');
const pauseBtn = document.getElementById('pauseBtn');
let paused = false;
pauseBtn.onclick = () => { paused = !paused; pauseBtn.textContent = paused ? 'Resume' : 'Pause'; };

const modelSelect = document.getElementById('modelSelect');
modelSelect.onchange = () => loadURL(modelSelect.value, modelSelect.selectedOptions[0].textContent);

document.getElementById('filePick').onchange = e => {
  const f = e.target.files[0];
  if (f) loadURL(URL.createObjectURL(f), f.name);
};

// Drag & drop a .glb from Finder.
const drop = document.getElementById('drop');
addEventListener('dragover', e => { e.preventDefault(); drop.style.display = 'flex'; });
drop.addEventListener('dragleave', () => drop.style.display = 'none');
addEventListener('drop', e => {
  e.preventDefault(); drop.style.display = 'none';
  const f = e.dataTransfer.files?.[0];
  if (f) loadURL(URL.createObjectURL(f), f.name);
});

// ?model=path/to/file.glb overrides the default.
const qs = new URLSearchParams(location.search).get('model');
if (qs) loadURL(qs, qs.split('/').pop());
else loadURL(modelSelect.value, modelSelect.selectedOptions[0].textContent);

// --- render loop -----------------------------------------------------------
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (current && !paused) current.rotation.y += dt * parseFloat(speedInput.value);
  mixer?.update(dt);
  controls.update();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Debug handle for console experiments (material tweaks, inspection).
window.viewer = { THREE, scene, camera, renderer, get model() { return current; } };
</script>
</body>
</html>
